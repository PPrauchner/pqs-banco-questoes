  pergunta: "Quais as vantagens do modelo de desenvolvimento em V? E as desvantagens?",
  resposta: `
    <p><strong>Vantagem:</strong> ênfase forte em <strong>verificação e validação</strong>. O modelo organiza o desenvolvimento em forma de “V”, associando a cada fase construtiva uma fase de teste correspondente:</p>
    <ul>
      <li>Requisitos ↔ teste de sistema</li>
      <li>Projeto arquitetural ↔ teste de integração</li>
      <li>Projeto detalhado ↔ teste de unidade</li>
      <li>Implementação — sem correspondência própria</li>
    </ul>
    <p><strong>Desvantagens:</strong></p>
    <ul>
      <li>Os requisitos só são efetivamente verificados e validados quando o software já está pronto.</li>
      <li>Mudanças de requisitos continuam custando caro.</li>
      <li>Exige muita documentação — e de qualidade, sem a qual não é possível derivar testes precisos.</li>
    </ul>`
},

{
  id: "T02", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", bullets: [],
  pergunta: "Qual a diferença entre o modelo em V e o modelo em W, e por que o modelo em W é considerado o melhor dos prescritivos?",
  resposta: `
    <p><strong>Diferença:</strong> no modelo em V os testes são executados <em>depois</em> da construção, em níveis correspondentes às fases; no <strong>modelo em W os testes são preparados durante as próprias fases de construção</strong>, e não depois.</p>
    <ul>
      <li>Durante a fase de requisitos → preparam-se os testes de sistema.</li>
      <li>Durante o projeto arquitetural → preparam-se os testes de integração.</li>
      <li>Durante o projeto detalhado → preparam-se os testes de unidade.</li>
    </ul>
    <p>Depois vêm a codificação e a execução dos testes (unidade → integração → sistema), cada rodada podendo gerar depuração e retorno à fase de codificação e mudança.</p>
    <p><strong>Por que é considerado o melhor dos prescritivos:</strong></p>
    <ul>
      <li>Testes planejados durante a construção, e não como etapa final.</li>
      <li><strong>Só se aceitam conceitos testáveis</strong>: se não é possível imaginar um teste para um requisito, é sinal de que ele não foi definido corretamente — o mesmo vale para arquitetura e projeto.</li>
      <li>Especialistas em teste envolvidos desde o início, o que antecipa a detecção de erros.</li>
      <li>Reduz a complexidade do projeto: ao pensar em como testar, percebe-se o que está complexo demais e trabalha-se para simplificar.</li>
    </ul>`
},

{
  id: "T03", tipo: "teorica", unidade: "Fundamentos", tema: "Fundamentos — conceitos de processo de software", bullets: [],
  pergunta: "O que é um processo de software? Apresente as definições dos autores estudados e o que elas têm em comum.",
  resposta: `
    <ul>
      <li><strong>Pressman:</strong> a metodologia que organiza as atividades, ações e tarefas necessárias para desenvolver software de alta qualidade. (Em outra formulação: abordagem adaptável que permite às pessoas selecionar o conjunto apropriado de ações e tarefas, visando entregar software no prazo e com qualidade suficiente.)</li>
      <li><strong>Sommerville:</strong> um conjunto de atividades relacionadas que leva à produção de um produto de software.</li>
      <li><strong>Wazlawick:</strong> conjunto de regras que define como o projeto deve ser executado.</li>
      <li><strong>Terceira definição apresentada em aula:</strong> conjunto de atividades interdependentes, com responsáveis definidos e com entradas e saídas bem estabelecidas.</li>
    </ul>
    <p><strong>Convergência:</strong> processo é a forma <strong>organizada e repetível</strong> de construir software — não uma sequência improvisada de passos.</p>`
},

{
  id: "T04", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", bullets: [],
  pergunta: "Diferencie projeto de software, processo de software e modelo de processo.",
  resposta: `
    <p><strong>Projeto de software</strong> — para Wazlawick, algo que ocorre em tempo determinado e consiste na execução concreta de um conjunto de atividades que visam criar um produto específico. Para Sommerville, a descrição da estrutura do software a ser implementado, dos modelos e estruturas de dados, das interfaces entre componentes e às vezes dos algoritmos. Para Pressman, a aplicação de princípios, conceitos e práticas que levam ao desenvolvimento de um sistema de alta qualidade.</p>
    <p><strong>Processo de software</strong> — o conjunto de regras/atividades que define <em>como</em> o projeto deve ser executado (Wazlawick); conjunto de atividades relacionadas que levam à produção de um produto de software (Sommerville).</p>
    <p><strong>Modelo de processo</strong> — a <strong>abstração</strong> de um processo de software: uma definição geral que será <strong>instanciada</strong> pelas equipes e empresas que a adotarem. Wazlawick: conjunto de regras mais abstratas que especificam a forma geral dos processos. Sommerville: representação simplificada de um processo; cada modelo expressa uma perspectiva particular e fornece informação parcial. Pressman: conjunto de atividades metodológicas e de apoio, ações e tarefas, podendo cada modelo ser descrito por um fluxo de processo diferente.</p>
    <p><strong>Em uma linha:</strong> o modelo é o molde abstrato, o processo é a regra adotada pela organização, e o projeto é a execução concreta em tempo determinado.</p>`
},

{
  id: "T05", tipo: "teorica", unidade: "Fundamentos", tema: "Fundamentos — conceitos de processo de software", bullets: [],
  pergunta: "Como os processos são classificados quanto à divulgação e quanto à formalização?",
  resposta: `
    <p><strong>Quanto à divulgação:</strong></p>
    <ul>
      <li><strong>Público</strong> — foi documentado, publicado e disponibilizado; qualquer pessoa ou organização pode adotá-lo. É com esse tipo que a disciplina trabalha.</li>
      <li><strong>Privado</strong> — processo interno e particular de uma organização, não divulgado, de uso exclusivo dela.</li>
    </ul>
    <p><strong>Quanto à formalização:</strong></p>
    <ul>
      <li><strong>Implícito</strong> — a equipe desenvolve com base apenas na experiência e no hábito, sem passos definidos (por exemplo: uma entrevista geral com o cliente e já partir para o código). É uma alternativa, mas não a mais profissional.</li>
      <li><strong>Explícito</strong> — etapas e procedimentos claramente definidos, ensinados, compartilhados e institucionalizados; usados por todos os membros da equipe nas situações em que se mostram adequados.</li>
    </ul>`
},

{
  id: "T06", tipo: "teorica", unidade: "Fundamentos", tema: "Fundamentos — conceitos de processo de software", bullets: [],
  pergunta: "O que é um artefato? Dê exemplos e explique por que a definição não se limita a código.",
  resposta: `
    <p><strong>Artefato é qualquer produto gerado durante o processo</strong> — não apenas código executável.</p>
    <p><strong>Exemplos:</strong> documento de especificação de requisitos, modelos UML (de requisitos ou de projeto), modelo de classes conceitual e de domínio, casos de teste, casos de aceitação, módulos funcionais do software.</p>
    <p>Na arquitetura do processo, os <strong>produtos (artefatos)</strong> são gerados por tarefas executadas por um papel; podem ser <strong>intermediários ou finais</strong> (o software funcionando), <strong>novos ou refinados/melhorados</strong>.</p>
    <p><strong>Por que a definição importa:</strong> processos utilizam recursos, estão sujeitos a restrições e geram artefatos intermediários e finais. Nos processos iterativos e incrementais, o incremento de um ciclo pode ser justamente um artefato novo — uma especificação, um modelo, casos de teste — e não necessariamente código, embora precise agregar valor.</p>`
},

{
  id: "T07", tipo: "teorica", unidade: "Fundamentos", tema: "Fundamentos — conceitos de processo de software", bullets: [],
  pergunta: "Descreva a arquitetura básica de um processo: seus elementos principais e complementares.",
  resposta: `
    <p>A arquitetura de um processo é formada por <strong>três elementos principais — papéis, tarefas e produtos</strong> — apoiados por três elementos complementares: <strong>orientações, modelos e ferramentas</strong>.</p>
    <p><strong>Elementos principais:</strong></p>
    <ul>
      <li><strong>Papéis (atores)</strong> — representam grupos ou classes de pessoas responsáveis por executar tarefas. Papel não é a pessoa: as pessoas são <em>instâncias</em> dos papéis, e uma mesma pessoa pode assumir mais de um papel. Ex.: engenheiro/analista de requisitos, projetista, programador, testador.</li>
      <li><strong>Tarefas</strong> — ações que produzem um resultado que atende total ou parcialmente a um objetivo; determinam o que cada papel deve executar para gerar ou modificar um produto. Possuem entradas e saídas; o sequenciamento define quando cada papel atua. Ex.: validar requisitos, estabelecer a arquitetura, desenvolver modelos, projetar a solução, integrar componentes.</li>
      <li><strong>Produtos (artefatos)</strong> — gerados por tarefas executadas por um papel; intermediários ou finais, novos ou refinados.</li>
    </ul>
    <p><strong>Elementos complementares:</strong></p>
    <ul>
      <li><strong>Modelos</strong> — essencialmente diagramas que auxiliam na compreensão do problema ou na definição da solução, além de padronizar os artefatos produzidos.</li>
      <li><strong>Ferramentas</strong> — softwares que apoiam o processo (ferramentas CASE, ferramentas de teste, a própria linguagem de programação).</li>
      <li><strong>Orientações</strong> — diretrizes, normas e regras que guardam experiência anterior e ajudam na tomada de decisão durante a execução das tarefas.</li>
    </ul>`
},

{
  id: "T08", tipo: "teorica", unidade: "Fundamentos", tema: "Fundamentos — conceitos de processo de software", bullets: [],
  pergunta: "Quais são os quatro tipos de fluxo de processo? Descreva cada um e dê um exemplo.",
  resposta: `
    <p>As etapas de referência são comunicação, planejamento, modelagem, construção e entrega.</p>
    <ul>
      <li><strong>Linear</strong> — cada etapa é executada em sequência: conclui-se uma e passa-se à seguinte, até o fim. Comum em processos prescritivos, mais rígidos e com etapas mais definidas. <em>Ex.: modelo em cascata e suas variações.</em></li>
      <li><strong>Iterativo</strong> — não é linear: possui vários ciclos e iterações. Pode-se voltar de uma etapa à anterior (da modelagem à comunicação, por exemplo) e repetir o ciclo várias vezes, concluindo apenas parte do trabalho em cada iteração. <em>Ex.: Processo Unificado.</em></li>
      <li><strong>Evolucionário</strong> — parte do princípio de que o software não termina na entrega: ele sofrerá manutenções e evoluções, gerando novas versões. Após a entrega, retorna-se à comunicação para a próxima versão. Não impede o trabalho em ciclos iterativos. <em>Ex.: desenvolvimento por versões sucessivas.</em></li>
      <li><strong>Paralelo</strong> — etapas podem ocorrer simultaneamente; por exemplo, modelagem acontecendo durante a comunicação e o planejamento, antes de seguir para construção e entrega. <em>Ex.: modelagem concorrente à engenharia de requisitos.</em></li>
    </ul>`
},

{
  id: "T09", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", bullets: [],
  pergunta: "Quais são os três grandes tipos de modelos de processo e o que distingue cada um?",
  resposta: `
    <ul>
      <li><strong>Prescritivos</strong> — fases, atividades e instruções rígidas e detalhadas. <strong>Ciclo único:</strong> cada etapa deve ser concluída para se passar à seguinte, e o software costuma ser entregue só ao final. Existem variações que vão de muito rígidas a razoavelmente flexíveis.</li>
      <li><strong>Iterativos e incrementais</strong> — vários subciclos; cada um foca um subconjunto de requisitos e acrescenta novas funcionalidades (ou melhora as existentes) que já agregam valor ao cliente.</li>
      <li><strong>Ágeis</strong> — também iterativos e incrementais, porém mais flexíveis e pragmáticos: enfatizam menos a definição de atividades e mais os fatores humanos e a interação com as partes interessadas.</li>
    </ul>`
},

{
  id: "T10", tipo: "teorica", unidade: "Fundamentos", tema: "Fundamentos — conceitos de processo de software", bullets: [],
  pergunta: "Para que servem os processos de software e por que eles existem?",
  resposta: `
    <p><strong>Para que servem:</strong> desenvolver software novo, do zero; manter — alterar ou evoluir softwares já existentes; e customizar ou adaptar software desenvolvido por terceiros.</p>
    <p><strong>Por que existem:</strong></p>
    <ul>
      <li>Desenvolve-se software para resolver, total ou parcialmente, problemas do mundo real por meio de computadores. Como essa é uma tarefa complexa, vale a premissa central: <strong>é preciso compreender corretamente o problema antes de pensar na solução</strong>. Sem entender o problema, não é possível produzir uma solução correta para ele.</li>
      <li>O processo nasce do <strong>aprendizado histórico</strong>: empresas e profissionais acumulam casos de sucesso e de fracasso; estudar ambos permite identificar os procedimentos e fatores que levam ao êxito (para repeti-los) e os que levam ao fracasso (para evitá-los). As etapas bem-sucedidas são documentadas justamente para poderem ser replicadas.</li>
    </ul>
    <p><strong>Equilíbrio:</strong> um processo fraco ou genérico demais se reflete em um produto final fraco; a ênfase excessiva em detalhismo acarreta perda de produtividade e de objetividade.</p>`
},

{
  id: "T11", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", bullets: [],
  pergunta: "O que é o modelo “codificar e consertar” e quais problemas ele apresenta?",
  resposta: `
    <p>É a forma tradicional (e ainda comum) de desenvolver, em que <strong>não há processo definido</strong>. O desenvolvedor parte de um entendimento preliminar das necessidades do cliente e vai direto ao código — sem engenharia de requisitos e sem projeto. Implementa, testa ele mesmo, apresenta ao cliente e, se não for aprovado, volta a corrigir, repetindo o ciclo até uma versão “razoavelmente satisfatória”.</p>
    <p><strong>Problemas:</strong></p>
    <ul>
      <li>Baseia-se em entendimento superficial dos requisitos — a engenharia de requisitos é a fase mais importante, pois define o que precisa ser feito; começar sem ela é “receita para o fracasso”.</li>
      <li>Alto risco de requisitos mal compreendidos ou simplesmente não identificados.</li>
      <li>O código sofre desgaste por manutenção: tantas correções sucessivas fazem o software ser entregue já “remendado” e difícil de manter.</li>
    </ul>
    <p><strong>Alerta:</strong> muitos profissionais que se dizem ágeis, na prática, usam apenas “codificar e consertar”. É um <strong>anti-modelo</strong>, e no quadro de evolução dos processos seu avanço é “nenhum”.</p>`
},

{
  id: "T12", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", bullets: [],
  pergunta: "Quais são as fases do modelo em cascata e quais seus principais defeitos?",
  resposta: `
    <p><strong>Fases (versão de Wazlawick):</strong> levantamento de requisitos do sistema → levantamento de requisitos de software → análise de requisitos → projeto → codificação → testes → operação/implantação. As três primeiras equivalem à atual engenharia de requisitos; a análise busca ambiguidades, incompletudes e conflitos nos requisitos.</p>
    <p>Proposto nos anos 1970, é um dos primeiros processos formalizados: fases rígidas, muita documentação e obrigatoriedade de concluir totalmente uma fase antes de iniciar a próxima.</p>
    <p><strong>Principais defeitos:</strong></p>
    <ul>
      <li>Exige que <strong>todos os requisitos sejam declarados em detalhe logo no início</strong> — o que frequentemente é impossível: clientes e stakeholders têm necessidades vagas e nem sequer conseguem conceber tudo o que o software poderia fazer. Cabe muitas vezes ao engenheiro de requisitos atuar como consultor e sugerir funcionalidades.</li>
      <li><strong>Erros de especificação só aparecem na implantação</strong>, quando o custo de correção é altíssimo.</li>
      <li>Algumas atividades poderiam ser paralelizadas, mas o modelo não permite.</li>
      <li>O software só é implantado ao final de todo o ciclo.</li>
    </ul>`
},

{
  id: "T13", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", bullets: [],
  pergunta: "O que é a cascata dupla e quais melhorias Royce propôs ao modelo em cascata?",
  resposta: `
    <p><strong>Cascata dupla:</strong> evolução quase imediata do cascata clássico — permite <strong>retornar à fase anterior quando um erro é descoberto</strong> (da análise para o levantamento, do projeto para a análise etc.). Na prática, muitas vezes é preciso voltar várias fases: dos testes ao projeto, do projeto ao levantamento de requisitos. Melhorou a detecção precoce de erros, mas <strong>não resolveu o problema</strong>: o software final continua sendo entregue só no fim.</p>
    <p>É aqui que aparece o <strong>problema da linguagem</strong>: “não falamos a mesma língua, falamos dialetos semelhantes” — termos mudam de significado entre áreas, regiões e faixas etárias, e isso gera erros graves de interpretação de requisitos, descobertos tarde demais.</p>
    <p><strong>Melhorias propostas por Royce:</strong></p>
    <ul>
      <li>Inserir uma fase de <strong>design</strong> entre o levantamento e a análise de requisitos, para acomodar limitações físicas do sistema.</li>
      <li>Produzir documentação de qualidade e aplicar <strong>inspeções</strong> sobre os documentos gerados.</li>
      <li>Entregar ao cliente a <strong>segunda versão</strong> do software, tratando a primeira como experimento (boa ideia, porém cara em tempo).</li>
      <li>Aplicar testes sistemáticos por <strong>especialistas independentes</strong> dos desenvolvedores, capacitados em planejar, controlar e monitorar testes.</li>
      <li><strong>Forte envolvimento do cliente</strong> e das partes interessadas — proposta hoje adotada pelos métodos ágeis.</li>
    </ul>`
},

{
  id: "T14", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", bullets: [],
  pergunta: "Descreva o modelo cascata entrelaçado (sashimi): suas fases, sua contribuição, vantagens e desvantagens.",
  resposta: `
    <p>Chamado assim porque o diagrama de fases sobrepostas lembra um prato japonês. <strong>Não é preciso encerrar totalmente uma fase para iniciar a seguinte</strong> — as fases se sobrepõem e podem correr em paralelo.</p>
    <p><strong>Fases:</strong> concepção → análise e especificação de requisitos → projeto de arquitetura → projeto detalhado → codificação e depuração → testes de sistema.</p>
    <p><strong>Contribuição importante:</strong> o <strong>projeto de arquitetura como fase intermediária</strong> entre análise e projeto detalhado. A arquitetura define o esqueleto do software, apoia-se fortemente nos requisitos não funcionais e é pouco flexível a mudanças — alterá-la depois gera custos altíssimos, podendo até obrigar a recomeçar o projeto.</p>
    <p><strong>Vantagens:</strong> uma fase só se conclui depois de consideradas questões da fase seguinte, o que gera ganho de conhecimento; as equipes de fases diferentes conversam mais, reduzindo a necessidade de documentação.</p>
    <p><strong>Desvantagens:</strong> início e término das fases ficam pouco explícitos, dificultando estabelecer marcos e definir os artefatos entregues por fase; o paralelismo pode gerar falhas de comunicação, aceitação de hipóteses erradas e ineficiência.</p>`
},

{
  id: "T15", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", bullets: [],
  pergunta: "Descreva o modelo cascata com subprojetos: fluxo, vantagens e desvantagens. Por que ele é considerado uma ponte para os processos iterativos e incrementais?",
  resposta: `
    <p><strong>Fluxo:</strong> concepção do software (viabilidade + levantamento de requisitos) → análise de requisitos (com possibilidade de retorno à concepção) → projeto arquitetônico → <strong>divisão em vários subprojetos desenvolvidos em paralelo</strong> → integração → operação.</p>
    <p><strong>Vantagens:</strong> subprojetos menores, mais rápidos e fáceis de gerenciar; explora melhor a modularidade; progresso mais visível; permite entregas parciais de funcionalidades conforme ficam prontas.</p>
    <p><strong>Desvantagens:</strong> interdependências entre subsistemas podem atrasar ou impedir o paralelismo; exige um projeto arquitetônico muito bem feito (válido para qualquer processo, mas aqui explícito); demanda grande capacidade de gerência para evitar inconsistências entre subsistemas; a integração final pode ser problemática se as dependências não forem bem geridas.</p>
    <p><strong>Ponte para os iterativos e incrementais:</strong> trabalha com <strong>ciclos paralelos</strong> e permite <strong>entregas parciais</strong> — é praticamente um antecessor dos processos iterativos e incrementais, ainda que dentro de uma moldura prescritiva.</p>`
},

{
  id: "T16", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", bullets: [],
  pergunta: "Descreva o modelo em espiral: seus ciclos típicos e as quatro etapas de cada ciclo.",
  resposta: `
    <p>Embora dividido em vários ciclos, <strong>continua sendo um modelo prescritivo</strong>. Seu foco central é <strong>analisar e mitigar riscos</strong>, e ele <strong>não define um único processo de desenvolvimento</strong>: a cada ciclo escolhe-se o processo mais adequado aos requisitos identificados.</p>
    <p><strong>Ciclos típicos:</strong></p>
    <ul>
      <li><strong>1º</strong> — estudo de viabilidade: vale a pena desenvolver o software? Gera protótipo inicial, ideia de operação, plano de requisitos e plano de ciclo de vida.</li>
      <li><strong>2º</strong> — engenharia de requisitos: levantamento e análise, requisitos de validação, novos protótipos e simulações, plano de desenvolvimento.</li>
      <li><strong>3º</strong> — projeto: modelos do produto, projeto de verificação e validação, plano de testes e de integração.</li>
      <li><strong>4º</strong> — projeto detalhado, codificação, testes de unidade, integração e aceitação, implantação e planejamento da próxima evolução.</li>
    </ul>
    <p><strong>As quatro etapas de cada ciclo:</strong></p>
    <ul>
      <li><strong>Definição de objetivos</strong> — objetivos específicos da fase, restrições de processo e produto, plano de gerenciamento detalhado, identificação de riscos e estratégias alternativas.</li>
      <li><strong>Avaliação e redução de riscos</strong> — análise detalhada de cada risco, providências para reduzi-lo e planos de contingência para mitigar impactos.</li>
      <li><strong>Desenvolvimento e validação</strong> — escolha do modelo de desenvolvimento mais adequado ao tipo de software e aos seus requisitos não funcionais.</li>
      <li><strong>Planejamento</strong> — revisão do projeto e decisão de seguir para o próximo laço, concluir ou <strong>abandonar</strong> o software.</li>
    </ul>`
},

{
  id: "T17", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", bullets: [],
  pergunta: "Quais as vantagens e desvantagens do modelo em espiral? Em que tipo de projeto ele não é recomendado?",
  resposta: `
    <p><strong>Vantagens:</strong></p>
    <ul>
      <li>Identifica riscos logo nas primeiras iterações, quando tempo e recursos ainda são amplos e o custo é menor.</li>
      <li>À medida que os custos crescem, os riscos tendem a diminuir.</li>
      <li>Inviabilidades técnicas, de orçamento ou de prazo são descobertas cedo.</li>
      <li>Fases bem definidas permitem acompanhamento objetivo.</li>
      <li>Adequado a projetos complexos, de alto risco de falha e com requisitos pouco conhecidos.</li>
    </ul>
    <p><strong>Desvantagens:</strong></p>
    <ul>
      <li>Não há indicação clara da quantidade de trabalho esperada por ciclo; o tempo de desenvolvimento é difícil de prever, sobretudo no início.</li>
      <li>Exige gerência muito experiente e eficaz, pois a movimentação entre fases e iterações é complexa.</li>
      <li><strong>Não recomendado para projetos de pequeno e médio porte com requisitos bem conhecidos</strong> — ali o custo da análise de riscos não se paga.</li>
    </ul>`
},

{
  id: "T18", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", bullets: [],
  pergunta: "O que é a cascata com redução de risco e que técnicas ela emprega?",
  resposta: `
    <p>É uma variação que <strong>aplica o conceito da espiral ao modelo em cascata</strong>. Insere-se uma <strong>fase de redução de riscos antes do início do processo</strong> — tipicamente antes do levantamento e análise de requisitos, mas possível antes de qualquer fase (análise, projeto, codificação ou testes). O objetivo é tornar os requisitos <strong>mais estáveis e bem definidos desde o começo</strong>.</p>
    <p><strong>Técnicas citadas (lista não exaustiva):</strong></p>
    <ul>
      <li>Protótipos de interface com o usuário;</li>
      <li>Storyboards com imagens descrevendo cenários de uso;</li>
      <li>Entrevistas com usuários e clientes, tantas quantas forem necessárias;</li>
      <li>Filmagem dos usuários, para entender como o trabalho realmente ocorre;</li>
      <li>Tempestade de ideias, grupo focal e outras técnicas de elicitação.</li>
    </ul>`
},

{
  id: "T19", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", bullets: [],
  pergunta: "O que é o desenvolvimento evolucionário/incremental, quais suas variações e quais seus pontos positivos?",
  resposta: `
    <p>Parte de uma <strong>descrição em esboço</strong> do software e executa <strong>especificação, desenvolvimento e validação de forma concorrente</strong>, produzindo uma versão inicial, várias versões intermediárias e, por fim, a versão final. Cada implementação é exposta ao usuário e aprimorada conforme o retorno recebido. O risco é degenerar no clássico “desenvolver e corrigir”.</p>
    <p><strong>Variações:</strong></p>
    <ul>
      <li><strong>Exploratório</strong> — trabalha intensamente com o cliente; começa pelas partes do sistema mais bem compreendidas e evolui com novas características propostas pelo cliente, até entregar o sistema final.</li>
      <li><strong>Com protótipos descartáveis</strong> — gera muitos protótipos com o objetivo de <em>compreender os requisitos</em>, experimentando justamente aqueles mal entendidos; os protótipos são apresentados aos stakeholders e ajustados conforme os pareceres.</li>
    </ul>
    <p><strong>Pontos positivos:</strong> atende às necessidades do cliente de forma mais imediata que o modelo em cascata; gera menos documentação e permite especificação gradual; e é um <strong>precursor dos modelos ágeis e iterativo-incrementais</strong> — à medida que os usuários compreendem melhor o problema, novos requisitos surgem e os antigos se ajustam.</p>`
},

{
  id: "T20", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", bullets: [],
  pergunta: "Quais são os três problemas principais do desenvolvimento evolucionário e qual seu limite de aplicação conforme o porte do sistema?",
  resposta: `
    <p><strong>Três problemas principais:</strong></p>
    <ul>
      <li><strong>Progresso pouco visível</strong> — é muito difícil medir o avanço real, o que dificulta a gerência.</li>
      <li><strong>Pouca documentação</strong> — as versões ficam registradas apenas no código ou em protótipos, sem apoio documental para evoluções futuras.</li>
      <li><strong>Estrutura degradada</strong> — alterações constantes sem refatoração adequada corrompem a estrutura; o software pode ser entregue já desgastado, tornando manutenções mais difíceis e caras.</li>
    </ul>
    <p><strong>Limites por porte:</strong> para sistemas <strong>pequenos</strong> — e, com bem mais risco, <strong>médios</strong> — pode ser alternativa, sobretudo quando o prazo é curto. Para sistemas de <strong>grande porte e longo tempo de vida</strong>, a abordagem é considerada <strong>inviável</strong>.</p>`
},

{
  id: "T21", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", bullets: [],
  pergunta: "O que é a prototipação evolucionária? Qual seu fluxo, quando é vantajosa e quais seus cuidados?",
  resposta: `
    <p>É a evolução do desenvolvimento evolucionário, baseada na <strong>prototipação cornerstone</strong>: protótipos desenvolvidos <strong>com seriedade, planejamento e cuidado, que passam a fazer parte do sistema final</strong>.</p>
    <p><strong>Fluxo:</strong> concepção inicial → projeto e implementação do protótipo → teste; se não for aceitável, refina-se em novo ciclo; se for aceitável, o software é finalizado e liberado. A equipe trabalha com o cliente principalmente sobre os <strong>aspectos visíveis do sistema</strong> (a interface).</p>
    <p><strong>Quando é vantajosa:</strong></p>
    <ul>
      <li>Cliente com dificuldade de comunicar seus requisitos — situação bastante frequente.</li>
      <li>Nem a equipe nem o cliente conhecem bem os requisitos.</li>
    </ul>
    <p><strong>Cuidados e desvantagens:</strong></p>
    <ul>
      <li>Difícil prever o tempo de desenvolvimento e saber se o processo avança a contento.</li>
      <li>Difícil identificar quando cada fase realmente terminou.</li>
      <li>Pode degenerar no modelo “codificar e consertar”.</li>
      <li>É preciso analisar os requisitos e produzir um projeto realista <strong>antes</strong> de iniciar a codificação.</li>
    </ul>`
},

{
  id: "T22", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", bullets: [],
  pergunta: "Descreva o modelo de entregas em estágios: fluxo, vantagens e desvantagens.",
  resposta: `
    <p>Modelo que <strong>entrega funcionalidades ao cliente ao final de cada iteração</strong>. É considerado precursor dos modelos iterativos e incrementais e também dos ágeis.</p>
    <p><strong>Fluxo:</strong> concepção inicial (entender requisitos e avaliar viabilidade) → análise de requisitos → projeto arquitetural → ciclos iterativos de projeto detalhado → codificação e depuração → teste → entrega. Ao fim de cada ciclo verifica-se se o projeto acabou; se não, incrementa-se o contador e um novo ciclo começa a partir do projeto detalhado. O projeto arquitetural é saída da análise de requisitos, pois é ali que se identificam os requisitos não funcionais que mais influenciam a arquitetura.</p>
    <p><strong>Vantagens:</strong> a cada ciclo a equipe planeja e sabe o que vai entregar; cliente e gerentes acompanham melhor a evolução do sistema; o cliente já pode usar o software antes do fim do projeto; com estágios bem planejados, as funcionalidades mais importantes chegam cedo, o que reduz a pressão sobre o cronograma.</p>
    <p><strong>Desvantagens:</strong> depende inteiramente de bom planejamento em dois níveis — <strong>técnico</strong> (mapear dependências entre módulos, para desenvolver primeiro aquilo de que os outros dependem) e <strong>gerencial</strong> (garantir que cada entrega agregue valor real ao cliente). Exige requisitos bem compreendidos.</p>`
},

{
  id: "T23", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", bullets: [],
  pergunta: "Qual a diferença entre o modelo orientado a cronograma e as entregas em estágios? Qual sua vantagem e qual perda ele assume?",
  resposta: `
    <p>Os dois têm o mesmo desenho geral (concepção → requisitos → projeto arquitetural → ciclos), mas no orientado a cronograma os ciclos são organizados em torno da <strong>priorização de requisitos</strong>: essenciais, desejáveis e opcionais — podendo-se usar uma técnica como o <strong>MoSCoW</strong>.</p>
    <p><strong>A diferença decisiva está na condição de parada do laço:</strong> em vez de perguntar “ainda há requisitos?”, pergunta-se <strong>“ainda há tempo?”</strong>. Existe um prazo final rígido, e só será entregue o que couber nele — daí a necessidade de tratar primeiro o que é essencial.</p>
    <p><strong>Vantagem:</strong> com cronograma rígido, garante que as funcionalidades essenciais estarão prontas — o cliente recebe um produto viável, ainda que incompleto.</p>
    <p><strong>Desvantagem:</strong> se nem tudo for entregue, houve tempo gasto analisando requisitos que não viraram software. É uma perda considerada <strong>aceitável</strong>: esses requisitos podem ser retomados em uma segunda versão.</p>`
},

{
  id: "T24", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", bullets: [],
  pergunta: "O que é a entrega evolucionária e o que determina seu comportamento?",
  resposta: `
    <p>É a <strong>combinação entre a prototipação evolucionária e as entregas em estágios</strong>. A equipe desenvolve uma versão, apresenta ao cliente e produz novas versões a partir dos pareceres recebidos.</p>
    <p><strong>O equilíbrio entre os dois lados é o que define o comportamento do processo:</strong></p>
    <ul>
      <li>Quanto mais o processo tenta acomodar <strong>todas</strong> as modificações sugeridas, mais ele se aproxima da <strong>prototipação evolucionária</strong>.</li>
      <li>Quanto mais as entregas permanecem <strong>planejadas</strong> e as sugestões são encaixadas nesse planejamento, mais ele se aproxima das <strong>entregas em estágios</strong>.</li>
    </ul>
    <p><strong>Objetivo:</strong> ter a flexibilidade da prototipação sem perder o planejamento da entrega em estágios.</p>`
},

{
  id: "T25", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", bullets: [],
  pergunta: "O que é o modelo orientado a ferramentas? Qual sua vantagem e qual sua limitação?",
  resposta: `
    <p>Apoia-se fortemente em <strong>ferramentas de prototipação e geração de código</strong>, permitindo produzir software rapidamente a partir de <strong>especificações de alto nível</strong>.</p>
    <p><strong>Vantagem:</strong> velocidade de produção. Pode ser combinado com outros processos — por exemplo, com o modelo espiral, que já trabalha bastante com protótipos.</p>
    <p><strong>Desvantagem:</strong> é <strong>limitado pelo que as ferramentas oferecem</strong>. Os requisitos só são atendidos se as ferramentas permitirem; quanto maior a complexidade dos requisitos, menor a cobertura possível.</p>`
},

{
  id: "T26", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", bullets: [],
  pergunta: "O que é o desenvolvimento formal de sistemas e quais suas duas diferenças centrais em relação ao cascata?",
  resposta: `
    <p>Possui semelhanças com o Cascata, mas se baseia na <strong>transformação matemática formal da especificação em programas executáveis</strong>.</p>
    <p><strong>Duas diferenças centrais:</strong></p>
    <ul>
      <li>A especificação de requisitos é redefinida como uma <strong>especificação formal matemática detalhada</strong>.</li>
      <li>As atividades de projeto, implementação e teste são substituídas por um <strong>processo de desenvolvimento transformacional</strong> — uma série de transformações matemáticas aplicadas sobre a especificação até chegar ao software.</li>
    </ul>
    <p><strong>Por que é pouco utilizado na prática:</strong> exige conhecimento matemático avançado, e há poucos profissionais capazes de aplicá-lo.</p>`
},

{
  id: "T27", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", bullets: [],
  pergunta: "Descreva o desenvolvimento orientado a reuso: condições necessárias, estágios, vantagens e desvantagens.",
  resposta: `
    <p>Abordagem que se tornou popular porque hoje existe muito código pronto disponível: bibliotecas, componentes e módulos de código livre na internet, além de software comercial vendido por empresas especializadas. É comum o termo <strong>COTS</strong> (<em>Commercial Off-The-Shelf</em>, “software de prateleira”) — produtos genéricos, ricos em funcionalidades, cujas capacidades precisam ser habilitadas ou desabilitadas conforme o uso.</p>
    <p><strong>Duas condições necessárias:</strong> uma <strong>ampla base de componentes reutilizáveis</strong> e uma <strong>infraestrutura de integração</strong>.</p>
    <p><strong>Estágios:</strong></p>
    <ul>
      <li><strong>1. Análise de componentes</strong> — a partir dos requisitos, busca-se componentes reutilizáveis. Raramente há correspondência exata: normalmente eles cobrem apenas parte da funcionalidade desejada.</li>
      <li><strong>2. Modificação dos requisitos</strong> — os requisitos são comparados com o que os componentes oferecem e alterados para refletir o disponível. Se não for possível alterá-los, volta-se à análise de componentes em busca de alternativas — ou decide-se desenvolver componentes novos.</li>
      <li><strong>3. Projeto de sistema com reuso</strong> — projeta-se (ou reutiliza-se) a arquitetura, organizada para acomodar os componentes escolhidos. Partes novas podem precisar ser projetadas.</li>
      <li><strong>4. Desenvolvimento e integração</strong> — desenvolve-se o que não pôde ser comprado, baixado ou reaproveitado, e integram-se todos os componentes.</li>
    </ul>
    <p><strong>Vantagens:</strong> reduz drasticamente a quantidade de software a ser efetivamente desenvolvida; custos e riscos menores; conclusão muito mais rápida.</p>
    <p><strong>Desvantagens:</strong> a <strong>modificação dos requisitos</strong> é o principal defeito — adequar o que o cliente quer ao que os componentes fazem pode resultar em um sistema que não atende de fato às suas necessidades. Há ainda o risco de <strong>comportamentos emergentes</strong>: ao integrar componentes de fabricantes diferentes, ou COTS mal configurados, o sistema pode exibir funcionalidades inesperadas, capacidades desnecessárias ou erros em momentos imprevisíveis. Funcionalidades não usadas devem ser explicitamente desabilitadas.</p>
    <p><strong>Observação:</strong> o reuso deve ser aplicado sempre que possível, mas um processo <em>totalmente</em> orientado a reuso nem sempre é a melhor escolha.</p>`
},

{
  id: "T28", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", bullets: [],
  pergunta: "O que é uma Linha de Produto de Software (SPL)? Quando compensa, quando não compensa e que mudanças sua adoção exige?",
  resposta: `
    <p>É a <strong>evolução estratégica do reuso</strong>: um conjunto de sistemas que compartilham características comuns — uma <strong>família de softwares</strong> — gerenciada para atender às necessidades de um segmento específico de mercado e construída a partir de um <strong>núcleo comum reaproveitado de forma sistemática</strong>. Aqui o reuso deixa de ser oportunista e passa a ser incorporado ao próprio processo de desenvolvimento.</p>
    <p><strong>Não compensa quando:</strong> existe apenas um produto único; os produtos não têm relacionamento entre si e não permitem ativos comuns; o número de produtos é pequeno.</p>
    <p><strong>Compensa quando:</strong> há no mínimo <strong>três produtos relacionados na mesma área</strong> — preferencialmente mais. A partir daí é possível gerenciar versões, otimizar o processo produtivo, e o custo fica abaixo do desenvolvimento convencional.</p>
    <p><strong>Mudanças que a adoção exige</strong> (não é decisão apenas técnica): na gerência do processo, na forma de desenvolver, na organização estrutural e de pessoal, na abordagem de negócio da empresa e na concepção arquitetônica dos produtos.</p>`
},

{
  id: "T29", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", bullets: [],
  pergunta: "Quais são as três atividades essenciais de uma Linha de Produto de Software?",
  resposta: `
    <ul>
      <li><strong>Desenvolvimento do núcleo de ativos</strong> — construir o conjunto de elementos reutilizáveis da linha; identificar os <strong>pontos de variação</strong> (o que muda de um reúso para outro) e produzir instruções/diretrizes sobre como reusar cada ativo.</li>
      <li><strong>Desenvolvimento de produtos</strong> — <em>entradas:</em> descrição do novo produto, escopo da linha (que decide se ele cabe nela), núcleo de ativos e plano de produção. <em>Saídas:</em> o produto, o parecer sobre o processo produtivo (lições aprendidas), possíveis novos ativos reaproveitáveis e novas restrições.</li>
      <li><strong>Gerência</strong> — <em>organizacional:</em> identificar a estratégia de negócio e as oportunidades da linha e de novos produtos. <em>Técnica:</em> acompanhar o desenvolvimento, verificar se os padrões estão sendo seguidos e buscar melhorias no processo.</li>
    </ul>
    <p><em>(Northrop, 2008, apud Wazlawick, 2013.)</em></p>`
},

{
  id: "T30", tipo: "teorica", unidade: "Prescritivos", tema: "Iterativos e incrementais — UP", bullets: [],
  pergunta: "O que caracteriza um processo iterativo e incremental? Diferencie “iterativo” de “incremental”.",
  resposta: `
    <p>Caracterizam-se por serem compostos de <strong>vários ciclos de desenvolvimento</strong>. Isso os diferencia dos processos prescritivos tradicionais, que possuem um <strong>único ciclo</strong>, exigem que cada etapa esteja totalmente concluída para se passar à seguinte e só entregam o software ao final de todo o ciclo.</p>
    <ul>
      <li><strong>Iterativo</strong> — o desenvolvimento ocorre em vários passos (ciclos) similares, ou seja, possui várias iterações.</li>
      <li><strong>Incremental</strong> — em cada ciclo <strong>algum valor é acrescentado ao produto</strong>: uma nova funcionalidade, uma melhoria ou refatoração de funcionalidades existentes, ou novos artefatos (especificações, requisitos, modelos de software, casos de teste).</li>
    </ul>
    <p><strong>Efeito colateral positivo:</strong> como o cliente vê o produto crescer ciclo a ciclo, a abordagem incentiva a participação das <strong>partes interessadas</strong> — qualquer pessoa que tenha interesse no desenvolvimento do software. Isso reduz erros de requisitos: interpretações erradas, ambiguidades, conflitos e outras anomalias.</p>`
},

{
  id: "T31", tipo: "teorica", unidade: "Prescritivos", tema: "Iterativos e incrementais — UP", bullets: [],
  pergunta: "Como os requisitos são distribuídos entre os ciclos em um processo iterativo e incremental? Qual a condição de viabilidade da abordagem?",
  resposta: `
    <p>A cada ciclo se considera um conjunto de requisitos, agrupados por <strong>ordem de priorização</strong> segundo dois critérios:</p>
    <ul>
      <li><strong>Importância para o cliente</strong> — o valor que o requisito agrega ao negócio;</li>
      <li><strong>Risco associado</strong> — complexidade que pode ter sido subestimada e instabilidade (requisitos sujeitos a muitas mudanças).</li>
    </ul>
    <p>Ao final de cada ciclo é produzido um <strong>novo incremento</strong> contendo extensões, refinamentos, novas funcionalidades ou novos artefatos em relação à versão anterior do sistema.</p>
    <p><strong>Condição de viabilidade:</strong> a abordagem <strong>só é viável se realmente for possível dividir os requisitos em diversos grupos e alocar cada grupo a um ciclo de desenvolvimento</strong>. Quando os requisitos possuem muitas interdependências entre si, essa divisão pode não ser possível.</p>`
},

{
  id: "T32", tipo: "teorica", unidade: "Prescritivos", tema: "Iterativos e incrementais — UP", bullets: [],
  pergunta: "Quais são as quatro fases do Processo Unificado e o objetivo de cada uma?",
  resposta: `
    <p>O UP é organizado em quatro fases, e cada fase é composta de diversos ciclos — <strong>com exceção da concepção</strong>, que normalmente se conclui em um único ciclo (embora nada impeça que seja dividida em mais de um).</p>
    <ul>
      <li><strong>Concepção</strong> — identifica os requisitos de negócio e determina a <strong>viabilidade</strong> do desenvolvimento: se vale a pena desenvolver o software considerando restrições de orçamento, cronograma, expertise da equipe e recursos de hardware e software. Os requisitos são analisados de forma <strong>abrangente, mas não em profundidade</strong>.</li>
      <li><strong>Elaboração</strong> — provavelmente a fase mais importante do UP: nela são desenvolvidos os requisitos mais arriscados e mais importantes, e grande parte da complexidade do software é resolvida. A arquitetura é consolidada em definitivo.</li>
      <li><strong>Construção</strong> — costuma ter mais ciclos e produzir mais código, mas trata de requisitos de dificuldade média a fácil; é “mais uma fase de trabalho do que uma fase difícil”. Ao final, um produto completo e utilizável deve estar desenvolvido, testado e pronto para uso.</li>
      <li><strong>Transição</strong> — o software é implantado no cliente. Ainda há alguma análise, projeto e implementação, mas em menor grau; é a fase de treinamentos, testes de aceitação e conversões de dados.</li>
    </ul>`
},

{
  id: "T33", tipo: "teorica", unidade: "Prescritivos", tema: "Iterativos e incrementais — UP", bullets: [],
  pergunta: "Quais são as quatro características centrais do Processo Unificado? Explique cada uma.",
  resposta: `
    <ul>
      <li><strong>Iterativo e incremental</strong> — o desenvolvimento é baseado em ciclos iterativos e, a cada iteração, incorporam-se à arquitetura as funcionalidades relativas aos casos de uso daquele ciclo. Cada ciclo acrescenta algo: conhecimento sobre requisitos e arquitetura, modelos (de projeto, de classes, de interação) e desenvolvimento ou melhoria de código. Em cada iteração, todas as disciplinas relativas àquela fase devem ser executadas no grau exigido pela fase. A <strong>integração contínua</strong> reduz riscos, facilita os testes e melhora o aprendizado da equipe.</li>
      <li><strong>Dirigido por casos de uso</strong> — os casos de uso definem todas as funcionalidades do software: identificam os requisitos funcionais e quem pode utilizá-los (os atores). Além disso, auxiliam na definição e validação da arquitetura, no planejamento das iterações, e servem de base para os casos de teste e para a documentação.</li>
      <li><strong>Centrado na arquitetura</strong> — a arquitetura é a estrutura, o “esqueleto” do software, e é pouco passível a mudanças; alterá-la pode afetar muito o projeto. O UP enfatiza uma arquitetura sólida e consolidada que atenda aos requisitos não funcionais. À medida que os casos de uso são identificados, detalhados e implementados, são integrados incrementalmente à arquitetura, em geral inseridos em componentes, módulos ou pacotes.</li>
      <li><strong>Focado em riscos</strong> — os casos de uso mais críticos, arriscados, complexos ou instáveis são enfocados nos primeiros ciclos. A razão é econômica e de prazo: no início, o custo para resolver a ocorrência de um risco ainda é baixo e ainda há tempo para se adaptar a situações não ideais. <strong>Atenção:</strong> nesse processo, “risco” inclui também <strong>valor de negócio</strong> — na elaboração podem ser implementadas funcionalidades pouco complexas, mas que agregam muito valor ao cliente.</li>
    </ul>`
},

{
  id: "T34", tipo: "teorica", unidade: "Prescritivos", tema: "Iterativos e incrementais — UP", bullets: [],
  pergunta: "Quais são as disciplinas do Processo Unificado e como sua ênfase varia entre as fases?",
  resposta: `
    <p><strong>Disciplinas:</strong> modelagem de negócio, requisitos, análise e projeto, implementação, teste, implantação, gerenciamento de configuração e mudança, gerenciamento de projeto e ambiente.</p>
    <ul>
      <li><strong>Concepção</strong> — ênfase muito forte em modelagem de negócio e requisitos (elicitação ampla, para determinar escopo e complexidade). Começa a haver análise e projeto: os requisitos mais arriscados são detalhados com mais profundidade para apoiar a decisão de viabilidade. Quase nenhuma implementação, poucos testes, nenhuma implantação, um pouco de gerenciamento de configuração e mudança.</li>
      <li><strong>Elaboração</strong> — ainda há bastante modelagem de negócio e levantamento de requisitos, embora ambos diminuam ao longo dos ciclos. Muita análise e projeto e muita implementação — não tanta quanto na construção, mas a mais importante e arriscada. Já há alguma implantação e alguns testes. O gerenciamento de configuração e mudança aumenta.</li>
      <li><strong>Construção</strong> — modelagem de negócio bem menor e elicitação bem reduzida. Análise e projeto reduz um pouco, mas segue importante. A implementação é muito alta, os testes aumentam e a implantação se torna bem maior. O gerenciamento de configuração e mudança cresce (várias versões em andamento).</li>
      <li><strong>Transição</strong> — quase não há mais modelagem de negócio nem elicitação; análise e projeto quase finalizada. Resta alguma implementação, referente a pequenas adaptações. Os testes diminuem bastante e a implantação é bastante grande, incluindo as conversões de dados. Ainda há bastante gerenciamento de configuração e mudança.</li>
    </ul>
    <p><strong>Constantes em todo o processo:</strong> o <strong>gerenciamento de projeto</strong> (alocação correta dos ciclos, cumprimento de cronograma e orçamento, qualidade e gerenciamento de riscos) e o <strong>ambiente</strong> (configuração das ferramentas para que a equipe trabalhe bem).</p>`
},

{
  id: "T35", tipo: "teorica", unidade: "Prescritivos", tema: "Iterativos e incrementais — UP", bullets: [],
  pergunta: "Quais são as principais atividades da fase de concepção do Processo Unificado?",
  resposta: `
    <p>A concepção costuma ser rápida e normalmente tem um único ciclo. Determina a viabilidade do desenvolvimento, identifica os principais riscos e o escopo básico do software. Os requisitos são analisados de forma <strong>abrangente, mas não em profundidade</strong>.</p>
    <ul>
      <li>Produzir um seminário curto de requisitos;</li>
      <li>Identificar a maioria dos atores e casos de uso; a maioria dos casos de uso é escrita em <strong>formato resumido</strong>, e de <strong>10 a 20%</strong> — os percebidos como mais complexos e arriscados — são escritos em detalhe, para melhorar a compreensão do escopo e da complexidade;</li>
      <li>Identificar os requisitos mais importantes e mais arriscados e produzir uma <strong>lista de riscos</strong>, já pensando em formas de resolvê-los ou evitá-los;</li>
      <li>Construir <strong>protótipos</strong>, que ajudam a compreender o problema, facilitam a comunicação com o cliente (evitando ambiguidades e resolvendo conflitos) e demonstram conceitos técnicos;</li>
      <li>Fazer investigações de <strong>viabilidade técnica</strong> de requisitos específicos;</li>
      <li>Recomendar quais componentes podem ser <strong>reutilizados ou comprados</strong> e quais devem ser construídos — o reuso acelera o desenvolvimento e reduz riscos, desde que exija pouca adaptação;</li>
      <li>Produzir uma proposta de <strong>arquitetura em alto nível</strong> para atender aos requisitos não funcionais (escalabilidade, confiabilidade, proteção, segurança, desempenho, usabilidade);</li>
      <li>Elaborar o plano da primeira iteração e gerar a <strong>lista de ferramentas candidatas</strong> (CASE, de interface humano-computador, SGBD e linguagem de programação).</li>
    </ul>`
},

{
  id: "T36", tipo: "teorica", unidade: "Prescritivos", tema: "Iterativos e incrementais — UP", bullets: [],
  pergunta: "Por que a elaboração é considerada a fase mais importante do Processo Unificado? O que acontece nela?",
  resposta: `
    <p>É onde realmente começam as iterações — em geral duas ou mais, de duas a seis semanas cada. Nessa fase:</p>
    <ul>
      <li>A <strong>maioria dos requisitos é descoberta e estabilizada</strong>, e os problemas encontrados neles são solucionados;</li>
      <li>O <strong>domínio do problema</strong> é analisado com bem mais profundidade;</li>
      <li>A <strong>arquitetura central e de risco alto é programada e testada</strong>, e a arquitetura é consolidada em definitivo;</li>
      <li>Os principais <strong>riscos</strong> são identificados e mitigados ou eliminados, criando-se também planos de contingência;</li>
      <li>A priorização dos casos de uso mais complexos permite eliminar ou ao menos diminuir o impacto da ocorrência de riscos.</li>
    </ul>
    <p>O UP trabalha com a perspectiva de que <strong>mudanças ocorrerão</strong> e busca reduzir seu impacto no projeto — e é na elaboração que essa redução acontece, porque é ali que se resolve grande parte da complexidade do software.</p>`
},

{
  id: "T37", tipo: "teorica", unidade: "Prescritivos", tema: "Iterativos e incrementais — UP", bullets: [],
  pergunta: "Descreva a técnica MoSCoW de priorização de requisitos.",
  resposta: `
    <ul>
      <li><strong>Essenciais (must)</strong> — sem eles o software não é útil ao cliente; devem ser implementados obrigatoriamente e primeiro. <strong>Definem o mínimo produto viável (MVP).</strong></li>
      <li><strong>Desejáveis (should)</strong> — agregam valor, mas não são obrigatórios; podem ficar para uma segunda versão caso o cronograma não permita.</li>
      <li><strong>Opcionais (could)</strong> — poderiam ser desenvolvidos, mas agregariam pouco valor; são os primeiros a serem deixados para novas versões.</li>
      <li><strong>Fora do escopo (won't)</strong> — não devem ser implementados porque estão fora do objetivo do software. Identificá-los é útil para <strong>não criar falsas expectativas no cliente</strong>, deixando claro desde o início que fazem parte de um projeto separado.</li>
    </ul>
    <p><strong>Onde aparece:</strong> no UP, para ordenar os casos de uso entre os ciclos; e no modelo orientado a cronograma, para decidir o que cabe no prazo rígido.</p>`
},

{
  id: "T38", tipo: "teorica", unidade: "Prescritivos", tema: "Iterativos e incrementais — UP", bullets: [],
  pergunta: "O que acontece nas fases de construção e de transição do Processo Unificado?",
  resposta: `
    <p><strong>Construção:</strong> trabalha os requisitos que ainda faltam — de complexidade média a baixa, que normalmente <strong>não impactam a arquitetura</strong>. Tem, em geral, mais ciclos que a elaboração, mas é mais uma fase de trabalho do que uma fase difícil. O esforço de análise e projeto é bem menor, e a maior parte do trabalho se refere à <strong>implementação e ao teste</strong> dos componentes da arquitetura relacionados a esses casos de uso. Busca garantir que o software atenda às necessidades dos usuários e se encaixe no contexto da organização. Ao final, um <strong>produto completo e utilizável</strong> deve estar desenvolvido, testado e pronto para uso pelo usuário final.</p>
    <p><strong>Transição:</strong></p>
    <ul>
      <li>O software é implantado no seu ambiente final;</li>
      <li>São realizados <strong>testes de aceitação</strong> com as partes interessadas;</li>
      <li>Os usuários são <strong>treinados</strong>;</li>
      <li>Podem ser necessárias pequenas adaptações;</li>
      <li>São feitas <strong>conversões de dados</strong> de sistemas anteriores (sistemas legados).</li>
    </ul>`
},

{
  id: "T39", tipo: "teorica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", bullets: [],
  pergunta: "Monte o quadro de evolução dos processos prescritivos, indicando o avanço que cada modelo trouxe.",
  resposta: `
    <ul>
      <li><strong>Codificar e consertar</strong> — nenhum avanço; anti-modelo, sem requisitos nem projeto.</li>
      <li><strong>Cascata clássico</strong> — primeira formalização em fases sequenciais e documentadas.</li>
      <li><strong>Cascata dupla</strong> — permite retorno à fase anterior ao detectar erros.</li>
      <li><strong>Cascata entrelaçado (sashimi)</strong> — sobreposição de fases e introdução do projeto de arquitetura; menos documentação.</li>
      <li><strong>Modelo em V</strong> — cada fase de construção associada a um nível de teste (V&amp;V).</li>
      <li><strong>Modelo em W</strong> — testes projetados junto com os artefatos; só conceitos testáveis são aceitos.</li>
      <li><strong>Cascata com subprojetos</strong> — paralelismo e entregas parciais; ponte para os processos iterativos e incrementais.</li>
    </ul>
    <p><strong>Segunda leva (Parte III):</strong> entregas em estágios (ciclos com entrega a cada estágio) → orientado a cronograma (mesmos ciclos, guiados por prioridade e limitados pelo prazo) → entrega evolucionária (flexibilidade da prototipação + planejamento das entregas) → orientado a ferramentas (rápido, limitado pelas ferramentas) → desenvolvimento formal (especificação matemática transformada em código) → orientado a reuso (montar o sistema a partir de componentes existentes) → linhas de produto (reuso sistemático a partir de um núcleo de ativos).</p>`
},

{
  id: "T40", tipo: "teorica", unidade: "Fundamentos", tema: "Fundamentos — conceitos de processo de software", bullets: [],
  pergunta: "Quais são as características gerais de um processo de software?",
  resposta: `
    <ul>
      <li>Utiliza <strong>recursos</strong>, está sujeito a <strong>restrições</strong> e gera <strong>artefatos</strong> intermediários e finais.</li>
      <li>Artefato é qualquer produto gerado durante o processo — não apenas código executável. Inclui documento de especificação de requisitos, modelos UML (de requisitos ou de projeto), casos de teste e casos de aceitação.</li>
      <li>Pode ser composto por <strong>subprocessos</strong> relacionados, organizados em hierarquia.</li>
      <li>As atividades têm <strong>critérios de entrada e saída</strong> bem definidos e uma organização lógica.</li>
      <li>Há <strong>diretrizes</strong> que justificam cada atividade, além de restrições e controles aplicados a atividades, recursos ou produtos.</li>
    </ul>`
},

{

  pergunta: "Quais são os quatro valores do Manifesto Ágil e qual é a leitura correta deles?",
  resposta: `
    <p>O Manifesto surgiu no <strong>fim dos anos 1990 / início dos anos 2000</strong>, da troca de experiências entre profissionais de engenharia e desenvolvimento de software sobre os processos em voga. Eles declaram estar descobrindo melhores formas de desenvolver software, fazendo e ajudando outros a fazer.</p>
    <ul>
      <li><strong>Indivíduos e interações</strong> acima de processos e ferramentas;</li>
      <li><strong>Software funcionando</strong> acima de documentação compreensível;</li>

      <li><strong>Responder às mudanças</strong> acima de seguir um plano.</li>

    <p><strong>Leitura correta:</strong> os valores da direita <strong>não são desprezados nem descartados</strong> — continuam tendo valor; apenas a prioridade maior é a dos valores da esquerda ("acima de", não "em lugar de").</p>`

{
  id: "T42", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis I — introdução e Manifesto", bullets: [],

  resposta: `

{
  id: "T43", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis I — introdução e Manifesto", bullets: [],
  pergunta: "Que críticas o Prof. Gilleanes faz aos princípios ágeis?",
  resposta: `
    <p>Na opinião do professor, vários princípios <strong>nem sempre são fáceis de seguir</strong> na prática:</p>
    <ul>
      <li><strong>Princípio 2 (mudanças bem-vindas)</strong> — para ele, mudanças <em>não</em> são bem-vindas. Os ágeis são de fato muito mais flexíveis que os clássicos, mas mudanças podem ser difíceis de adaptar e custosas em desenvolvimento e cronograma. A saída é a <strong>negociação com o cliente</strong> e, principalmente, a <strong>priorização de requisitos</strong> para definir o mínimo produto viável (MVP).</li>
      <li><strong>Princípio 4 (trabalho diário conjunto)</strong> — destacar usuários-chave e partes interessadas importantes é às vezes <strong>inviável ou impossível</strong>, por custo proibitivo: a empresa depende demais desses profissionais.</li>
      <li><strong>Princípio 9 (excelência técnica)</strong> — excelente, mas exige <strong>muito profissionalismo</strong> para não ser sacrificado pela pressão do cronograma e do cliente.</li>
      <li><strong>Princípio 10 (simplicidade)</strong> — com prazos curtos, a simplicidade pode ser sacrificada, e isso <strong>terá um custo no futuro</strong>, na manutenção e na evolução do software.</li>
    </ul>
    <p>Na mesma linha, ele destaca que a forte participação das partes interessadas, preconizada pelos ágeis, nem sempre é possível de conseguir.</p>`
},

{
  id: "T44", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis I — introdução e Manifesto", bullets: [],
  pergunta: "Quando não usar um processo ágil? Em que premissa sobre os requisitos os ágeis se apoiam?",
  resposta: `
    <p><strong>Premissa:</strong> os defensores dos ágeis argumentam que os requisitos são <strong>instáveis</strong>, por causa do dinamismo das empresas: um requisito pode ser descartado, mudar muito, ou novos podem surgir. Um processo prescritivo, orientado a planos, poderia então entregar um software <strong>já desatualizado</strong>.</p>
    <p>Mas, nas palavras do professor, <strong>"processo de desenvolvimento não é a mesma coisa que time de futebol"</strong>: não há processo favorito nem melhor que outro — há processos <strong>mais adequados a determinadas situações</strong>.</p>
    <p><strong>O prescritivo tende a ser mais adequado</strong> (logo, não usar ágil) para software:</p>
    <ul>
      <li>do qual <strong>dependerão vidas humanas</strong>;</li>
      <li>que pode causar <strong>grandes prejuízos</strong> à segurança, ao ambiente ou à economia;</li>
      <li>muito complexo, que <strong>exige muito planejamento e documentação</strong> e cujo desenvolvimento levará muito tempo.</li>
    </ul>
    <p><strong>O ágil tende a ser mais adequado</strong> com requisitos de forte instabilidade, que podem mudar ao longo do desenvolvimento, em contextos de negócio dinâmicos.</p>`
},

{
  id: "T45", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis I — introdução e Manifesto", bullets: [],
  pergunta: "Quais são os problemas na adoção de processos ágeis (Sommerville) e qual a alternativa recorrente do professor?",
  resposta: `
    <ol>
      <li><strong>Envolvimento constante do cliente</strong> — proibitivo ou quase impossível em muitas empresas: usuários-chave têm custo alto e são quase insubstituíveis.</li>
      <li><strong>Perfil inadequado da equipe</strong> — a integração em equipe exigida é muito alta e alguns profissionais não conseguem se adaptar.</li>
      <li><strong>Mudanças podem não ser bem-vindas</strong> — sempre causam impacto, e o custo pode ser muito alto, sobretudo quando afetam a arquitetura (às vezes o projeto quase recomeça).</li>
      <li><strong>Priorizar mudanças não é fácil</strong> — em sistemas grandes, muitas partes interessadas com interesses diferentes querem ser atendidas primeiro; há um fator humano: nem todos cedem ou negociam, "quando as pessoas têm egos bem alimentados".</li>
      <li><strong>Manter a simplicidade do código não é fácil</strong> — exige boas práticas, padrões de codificação, inspeções e refatoração constante; cronograma curto e pressão do cliente levam a sacrificá-la.</li>
      <li><strong>Organizações com processos rígidos</strong> — empresas que passaram anos definindo e treinando processos prescritivos resistem, sobretudo os funcionários mais antigos.</li>
      <li><strong>Contratos de desenvolvimento</strong> — sem uma especificação completa como base, o contrato passa a fixar o tempo de desenvolvimento; estimar é difícil, atrasos extrapolam o cronograma e nem sempre o cliente aceita pagar a mais.</li>
      <li><strong>Continuidade da equipe e documentação</strong> — os ágeis rejeitam só a documentação burocrática, mas quando membros saem o conhecimento implícito se perde, e os novos precisam de documentação.</li>
    </ol>
    <p><strong>Alternativa recorrente do professor:</strong> priorização de requisitos (<strong>MoSCoW</strong>) e negociação — <strong>essenciais</strong> (definem o MVP), <strong>desejáveis</strong> (podem ficar para uma segunda versão), <strong>opcionais</strong> (só se sobrar tempo) e <strong>fora do escopo</strong> (avisar o cliente desde já, para não criar falsas expectativas).</p>`
},

{
  id: "P39", tipo: "pratica", unidade: "Ágeis", tema: "Ágeis II — FDD", alvo: "FDD",
  bullets: [
    "Sistema de gestão para uma rede varejista com lojas em todo o país, com uma quantidade de funcionalidades bem maior que o normal e alto grau de complexidade;",
    "A empresa dispõe de uma equipe grande, e a diretoria quer várias equipes trabalhando ao mesmo tempo para reduzir o tempo de execução do projeto;",
    "Os gerentes de compras, estoque e financeiro conhecem profundamente os processos de seus setores e estão disponíveis para apresentá-los à equipe;",
    "A diretoria exige um projeto bem estruturado desde o início, apoiado em modelagem orientada a objetos do domínio;",
    "A auditoria interna quer saber, para cada requisito, quem o pediu, por que e quando, e quais artefatos serão alterados se ele mudar;",
    "A empresa conta com programadores experientes para liderar as equipes de desenvolvimento."
  ],
  resposta: `
    <p><strong>FDD (Feature Driven Development — Desenvolvimento Dirigido a Funcionalidades)</strong> — processo ágil voltado principalmente a <strong>projetos grandes</strong>, com quantidade de funcionalidades maior que o normal e certo grau de complexidade.</p>
    <ul>
      <li><strong>Afirmação 1</strong> — é a definição do processo: projeto grande, com muitas funcionalidades e complexo.</li>
      <li><strong>Afirmação 2</strong> — o FDD trabalha com <strong>equipes grandes</strong> e permite que <strong>várias equipes trabalhem simultaneamente</strong>, reduzindo o tempo de execução do projeto.</li>
      <li><strong>Afirmação 3</strong> — os gerentes são os <strong>especialistas em domínio</strong> (usuários-chave), que mais fornecem insumos para a elicitação e a compreensão dos requisitos; no DMA, eles apresentam à equipe o conhecimento da sua área no <em>domain walkthrough</em>.</li>
      <li><strong>Afirmação 4</strong> — o FDD produz <strong>projetos bem estruturados desde a primeira fase</strong> e trabalha intensamente com <strong>modelagem orientada a objetos do domínio</strong>, uma de suas boas práticas.</li>
      <li><strong>Afirmação 5</strong> — o processo é <strong>altamente documentado</strong> e por isso muito <strong>rastreável</strong>: rastreabilidade <em>para trás</em> (quem pediu o requisito, por que e quando) e <em>para a frente</em> (que artefatos uma mudança altera).</li>
      <li><strong>Afirmação 6</strong> — neutraliza uma desvantagem do processo: o projeto <strong>depende muito das decisões dos programadores líderes</strong>, que precisam ter bastante experiência.</li>
    </ul>
    <p><strong>Por que não o Crystal Clear:</strong> ele foi projetado para equipes de <strong>até 8 desenvolvedores</strong> e projetos de risco relativamente pequeno, é <strong>ultraleve</strong> (reduz a papelada) e não é adequado a projetos grandes e complexos; aqui há uma equipe grande, várias equipes em paralelo e exigência de documentação rastreável — o contexto do FDD.</p>`
},

{
  id: "P40", tipo: "pratica", unidade: "Ágeis", tema: "Ágeis II — FDD", alvo: "FDD",
  bullets: [
    "Sistema de arrecadação e fiscalização tributária para a prefeitura de uma capital, de grande porte;",
    "Antes de construir, fiscais experientes apresentam à equipe o conhecimento da área, e grupos de no máximo três pessoas criam modelos candidatos que depois são unidos em um modelo único;",

    "O planejamento fixa prazos por atividade e por área de negócio, prioriza o que é mais complexo e arriscado e atribui cada classe a um desenvolvedor responsável por ela;",
    "A construção acontece em ciclos de uma a duas semanas: projeta-se em detalhe um pacote de funcionalidades e depois ele é implementado, inspecionado e testado;",
    "Ao final de cada ciclo, as classes aprovadas nos testes de unidade e de integração são promovidas ao build."
  ],
  resposta: `
    <p><strong>FDD.</strong> O enunciado descreve o próprio processo, subprocesso por subprocesso.</p>
    <ul>
      <li><strong>Afirmação 1</strong> — projeto grande, o tipo de projeto a que o FDD se destina.</li>
      <li><strong>Afirmação 2</strong> — é o <strong>DMA (Desenvolver Modelo Abrangente)</strong>: os especialistas de domínio fazem o estudo dirigido (<em>domain walkthrough</em>); grupos de <strong>no máximo três pessoas</strong> criam <strong>modelos candidatos</strong>, que são apresentados, refinados e unidos em um <strong>modelo único</strong>.</li>
      <li><strong>Afirmação 3</strong> — é o <strong>CLF (Construir Lista de Funcionalidades)</strong>: <strong>Área de Negócio → Atividade de Negócio → Passo de Negócio</strong> (a funcionalidade), ligados por agregação.</li>
      <li><strong>Afirmação 4</strong> — é o <strong>PPF (Planejar Por Funcionalidade)</strong>: prazos por atividade e por área de negócio, priorização das atividades mais complexas ou de risco alto e atribuição da <strong>propriedade das classes</strong> (a boa prática da classe proprietária).</li>
      <li><strong>Afirmação 5</strong> — é a fase de <strong>Construção</strong>, iterativa, em ciclos de <strong>uma a duas semanas</strong>: <strong>DPF (Detalhar Por Funcionalidade)</strong>, que projeta o pacote de funcionalidades da iteração, e <strong>CPF (Construir Por Funcionalidade)</strong>: implementar → inspecionar o código → teste de unidade.</li>
      <li><strong>Afirmação 6</strong> — é a última atividade do CPF: o programador líder <strong>promove a versão atual ao build</strong>, depois dos testes de integração.</li>
    </ul>
    <p>As afirmações 2 a 4 formam a fase de <strong>Concepção e Planejamento</strong> (DMA → CLF → PPF), que produz o modelo de classes e o plano de desenvolvimento que alimentam a Construção (DPF → CPF).</p>
    <p><strong>Por que não o Crystal Clear:</strong> ele também é iterativo, mas organiza o ciclo de vida em projeto → entregas → iterações, cada iteração com estimação → desenvolvimento → celebração, e não prevê modelo abrangente, lista de funcionalidades nem propriedade de classes; além disso, foi projetado para equipes de até 8 pessoas, não para um projeto de grande porte.</p>`
},

{
  id: "T48", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis II — FDD", bullets: [],
  pergunta: "Quais são as fases do FDD e os subprocessos de cada uma? Descreva o que cada subprocesso produz.",
  resposta: `
    <p>O FDD tem <strong>duas fases</strong>. A <strong>Concepção e Planejamento</strong> (principalmente engenharia de requisitos; entrada: os requisitos) parte da premissa de que se deve <strong>pensar antes de começar a construir</strong>. A <strong>Construção</strong> (principalmente projeto e codificação) é a fase <strong>iterativa</strong>, em ciclos de uma a duas semanas.</p>
    <ul>
      <li><strong>DMA — Desenvolver Modelo Abrangente</strong> — estudo dirigido do domínio com os especialistas; grupos de no máximo três pessoas criam modelos candidatos, unidos em um modelo único. Produz o <strong>modelo conceitual</strong> (classes de entidade, sem métodos), eventualmente métodos e atributos, diagramas de sequência ou de máquina de estados e comentários sobre o modelo.</li>
      <li><strong>CLF — Construir Lista de Funcionalidades</strong> — produz a lista de <strong>áreas de negócio</strong>, de <strong>atividades</strong> de cada área e de <strong>passos (funcionalidades)</strong> de cada atividade; pode-se aplicar decomposição funcional.</li>
      <li><strong>PPF — Planejar Por Funcionalidade</strong> — produz os prazos de cada atividade e de cada área de negócio, a atribuição dos programadores líderes às atividades e a lista de desenvolvedores com as classes de que são proprietários, priorizando o mais complexo e arriscado.</li>
      <li><strong>DPF — Detalhar Por Funcionalidade</strong> — projeto orientado a objetos do pacote de funcionalidades da iteração. Produz a capa com comentários do pacote, os diagramas de sequência e projetos alternativos, o modelo de classes atualizado (que ganha métodos e vira modelo de domínio), as interfaces de classe e a lista de tarefas dos desenvolvedores.</li>
      <li><strong>CPF — Construir Por Funcionalidade</strong> — implementar classes e métodos → inspecionar o código → teste de unidade → promover a versão atual ao build (após os testes de integração). Produz as classes promovidas e um conjunto de funcionalidades com valor agregado que o cliente já pode usar.</li>
    </ul>
    <p>A Concepção e Planejamento produz o <strong>modelo de classes</strong> e o <strong>plano de desenvolvimento</strong> que alimentam a Construção. Se o software não estiver concluído ao fim do CPF, volta-se ao DPF com um novo pacote de funcionalidades.</p>`
},

{
  id: "T49", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis II — FDD", bullets: [],
  pergunta: "Quais são os papéis do FDD e as responsabilidades de cada um?",
  resposta: `
    <ul>
      <li><strong>Gerente de projeto</strong> — aspectos administrativos; gestão de tarefas e prazos (cumprimento do cronograma); operação do centro de controle; contato com o cliente; divulgação do status do projeto.</li>
      <li><strong>Arquiteto chefe</strong> — desenvolve a <strong>arquitetura do software</strong>, o "esqueleto" que estabelece como os módulos se organizam; responde por grande parte da modelagem e gerencia os demais arquitetos.</li>
      <li><strong>Programador líder</strong> — lidera a equipe de programadores; pode haver mais de um.</li>
      <li><strong>Gerente de desenvolvimento</strong> — gerencia a equipe de desenvolvedores e os prazos das iterações; coordena entregas e relatórios com o arquiteto chefe e o programador líder.</li>
      <li><strong>Proprietário de classe</strong> — desenvolvedor a quem são atribuídas uma ou mais classes pelas quais se responsabiliza, com prazo relativamente curto (cerca de duas semanas) para suas tarefas.</li>
      <li><strong>Especialista em domínio</strong> — usuário-chave, que conhece profundamente um departamento, setor ou processo da empresa; é quem mais fornece insumos para a elicitação e a compreensão dos requisitos.</li>
      <li><strong>Outros membros</strong> — testadores, escritores técnicos (especificação de requisitos e outros documentos), administradores de sistema (hardware e software de apoio) e gestores de ferramentas.</li>
    </ul>
    <p>Por trabalhar com tantos papéis, o FDD exige <strong>equipes grandes</strong> — e não funciona bem com equipes pequenas.</p>`
},

{
  id: "T50", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis II — FDD", bullets: [],
  pergunta: "Compare o FDD com o Processo Unificado (UP): o que os aproxima e o que os diferencia?",
  resposta: `
    <p><strong>O que os aproxima:</strong></p>
    <ul>
      <li>Ambos são <strong>iterativos</strong>: o UP desenvolve em vários ciclos, e a Construção do FDD é uma fase iterativa, em ciclos de uma a duas semanas.</li>
      <li>Ambos produzem <strong>bastante modelagem e documentação</strong>: o FDD trabalha intensamente com modelagem orientada a objetos; o UP foi criado em conjunto com a UML e produz modelos de projeto, de classes e de interação a cada ciclo.</li>
      <li>Ambos atacam primeiro o mais difícil: o PPF do FDD prioriza as atividades mais complexas ou de risco alto; o UP é <strong>focado em riscos</strong> e enfoca nos primeiros ciclos os casos de uso mais críticos, arriscados, complexos ou instáveis.</li>
      <li>Ambos dão peso à estrutura do sistema: no FDD, o arquiteto chefe desenvolve a arquitetura, o "esqueleto" do software; o UP é <strong>centrado na arquitetura</strong>.</li>
    </ul>
    <p><strong>O que os diferencia:</strong></p>
    <ul>
      <li><strong>Família</strong> — o FDD é um processo <strong>ágil</strong>, que não aceita documentação burocrática ou inútil; o UP é estudado entre os prescritivos, como processo iterativo e incremental.</li>
      <li><strong>Unidade de organização</strong> — o FDD é <strong>dirigido a funcionalidades</strong>, organizadas em áreas, atividades e passos de negócio; o UP é <strong>dirigido por casos de uso</strong>.</li>
      <li><strong>Fases</strong> — o FDD tem <strong>duas</strong>: Concepção e Planejamento (DMA → CLF → PPF), que modela e planeja o projeto inteiro antes de construir, e Construção (DPF → CPF), a única iterativa. O UP tem <strong>quatro</strong> — Concepção, Elaboração, Construção e Transição —, cada uma composta de ciclos (a concepção, normalmente, de um só), e trata os requisitos na concepção de forma abrangente, mas não em profundidade.</li>
      <li><strong>Divisão do trabalho</strong> — o FDD atribui cada classe a um <strong>proprietário de classe</strong> e cada atividade de negócio a um programador líder; o UP aloca grupos de casos de uso a cada ciclo, por valor de negócio e por risco.</li>
    </ul>`
},

    <p><strong>DSDM (Dynamic Systems Development Method).</strong></p>
    <p>O DSDM foi criado para projetos com <strong>cronogramas curtos e orçamentos fixos</strong>, que não aceitam mudanças — ou ao menos não aceitam grandes mudanças —, com o objetivo de entregar dentro do prazo e do orçamento sem perder qualidade. É um método ágil <strong>baseado em contrato</strong>, assinado ainda no pré-projeto.</p>
    <ul>
      <li><strong>Afirmações 1 e 2</strong> — cronograma curto (a data do congresso) e orçamento fixo em contrato: exatamente o tipo de projeto para o qual o DSDM existe.</li>
      <li><strong>Afirmação 3</strong> — condição do DSDM: <strong>definir claramente os requisitos e priorizá-los</strong>, estabelecendo a ordem de implementação.</li>
      <li><strong>Afirmação 4</strong> — condição do DSDM: <strong>facilidade de decompor os requisitos em módulos</strong>.</li>
      <li><strong>Afirmação 5</strong> — condição do DSDM: <strong>forte interação</strong> entre a equipe de desenvolvimento, os usuários finais e os gestores do projeto.</li>
      <li><strong>Afirmação 6</strong> — afasta os casos em que o DSDM não é apropriado: projetos complexos, difíceis de decompor; e confirma que não haverá grandes mudanças.</li>
    </ul>
    <p><strong>Por que não o FDD:</strong> o FDD também é um ágil que planeja antes de construir, mas é voltado a <strong>projetos grandes, com muitas funcionalidades e certo grau de complexidade</strong>, trabalhados por equipes grandes e com bastante documentação e modelagem orientada a objetos. Aqui o projeto é de porte médio e sem grande complexidade, e o que domina é o prazo curto e o orçamento fixo em contrato — o terreno do DSDM.</p>`

      <li><strong>Afirmação 3</strong> — o <strong>estudo de viabilidade</strong>, primeiro estágio do ciclo de vida, com suas quatro saídas: relatório de viabilidade, protótipo inicial de viabilidade, plano de desenvolvimento e controle de risco.</li>

{

      <li><strong>Afirmação 3</strong> — a <strong>MoSCoW</strong> (os <em>Should</em> deveriam ser feitos, mas podem ficar para uma 2ª versão) e o <strong>princípio de Pareto</strong>: 20% dos requisitos correspondem a 80% do software, então entregar os mais importantes já satisfaz razoavelmente o cliente com um produto minimamente viável.</li>
