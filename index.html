<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banco de Questões PQS</title>
<style>
  :root{ color-scheme: light dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none !important}
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --paper:#ECEFF2;
  --surface:#FFFFFF;
  --surface-2:#F4F6F8;
  --ink:#10171D;
  --ink-2:#4C5B66;
  --ink-3:#7C8B95;
  --line:#D5DBE1;
  --line-2:#BFC8D0;
  --accent:#0D6A6D;
  --accent-2:#0A5052;
  --accent-soft:#DCEBEA;
  --on-accent:#FFFFFF;
  --pratica:#9A4F17;
  --pratica-soft:#F2E6D8;
  --teorica:#2B5B85;
  --teorica-soft:#DCE7F1;
  --sabe:#33683F;
  --sabe-soft:#DFEBE0;
  --revisar:#8C3F2E;
  --revisar-soft:#F4E2DD;
  --shadow:0 1px 2px rgba(16,23,29,.05), 0 12px 30px -20px rgba(16,23,29,.45);
  --r:12px;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --disp:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1216;
    --surface:#141C22;
    --surface-2:#1B252C;
    --ink:#E2E8EC;
    --ink-2:#A0AEB8;
    --ink-3:#77858F;
    --line:#26323A;
    --line-2:#37454F;
    --accent:#4FB4AF;
    --accent-2:#78CCC7;
    --accent-soft:#11302E;
    --on-accent:#07211F;
    --pratica:#DBA066;
    --pratica-soft:#322415;
    --teorica:#82B4DE;
    --teorica-soft:#16283A;
    --sabe:#7FBE8B;
    --sabe-soft:#152A1B;
    --revisar:#DE9483;
    --revisar-soft:#331C17;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -22px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0C1216;
  --surface:#141C22;
  --surface-2:#1B252C;
  --ink:#E2E8EC;
  --ink-2:#A0AEB8;
  --ink-3:#77858F;
  --line:#26323A;
  --line-2:#37454F;
  --accent:#4FB4AF;
  --accent-2:#78CCC7;
  --accent-soft:#11302E;
  --on-accent:#07211F;
  --pratica:#DBA066;
  --pratica-soft:#322415;
  --teorica:#82B4DE;
  --teorica-soft:#16283A;
  --sabe:#7FBE8B;
  --sabe-soft:#152A1B;
  --revisar:#DE9483;
  --revisar-soft:#331C17;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -22px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ---------- barra superior ---------- */
.bar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.bar-in{
  max-width:820px; margin:0 auto; padding:10px 16px;
  display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center;
}
.brand{
  font-family:var(--disp); font-weight:700; font-size:14px; letter-spacing:-.01em;
  margin-right:auto; display:flex; align-items:baseline; gap:8px;
}
.brand small{
  font-family:var(--mono); font-weight:500; font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3);
}
.seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px}
.seg button{
  font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.04em;
  border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  padding:5px 11px; border-radius:999px; line-height:1.2;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
.seg button:focus-visible, .ico:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.ico{
  font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.04em;
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  padding:6px 11px; border-radius:999px; cursor:pointer;
}
.ico:hover{border-color:var(--line-2); color:var(--ink)}
select{
  font-family:var(--mono); font-size:11px; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:6px 10px; max-width:100%;
}
.progress{height:2px; background:var(--line); position:relative}
.progress i{position:absolute; inset:0 auto 0 0; background:var(--accent); width:0; transition:width .25s ease}

/* ---------- área principal ---------- */
main{max-width:820px; margin:0 auto; padding:24px 16px 120px}

.meta{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--ink-3);
  margin-bottom:12px;
}
.tag{
  display:inline-flex; align-items:center; gap:6px;
  padding:3px 9px; border-radius:999px; font-weight:600;
  font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
}
.tag.pratica{background:var(--pratica-soft); color:var(--pratica)}
.tag.teorica{background:var(--teorica-soft); color:var(--teorica)}
.tag.tema{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); text-transform:none; letter-spacing:.03em}
.meta .cont{margin-left:auto; font-variant-numeric:tabular-nums}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden;
}
.card-in{padding:26px 24px}
@media (max-width:480px){ .card-in{padding:20px 17px} }

.intro{
  font-family:var(--disp); font-weight:600; font-size:14px; color:var(--ink-2);
  margin:0 0 14px;
}
ul.cenario{list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column; gap:10px}
ul.cenario li{
  position:relative; padding-left:20px; color:var(--ink); font-size:16.5px; line-height:1.55;
}
ul.cenario li::before{
  content:""; position:absolute; left:0; top:.62em;
  width:9px; height:1.5px; background:var(--line-2);
}
.pergunta{
  font-family:var(--disp); font-weight:600; font-size:19px; line-height:1.38;
  letter-spacing:-.011em; text-wrap:balance; margin:0;
  padding-top:18px; border-top:1px solid var(--line);
}
.card.semcenario .pergunta{border-top:0; padding-top:0; font-size:20px}

.acoes{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:20px}
.btn-rev{
  font-family:var(--disp); font-weight:600; font-size:13.5px;
  background:var(--accent); color:var(--on-accent); border:0; border-radius:8px;
  padding:10px 16px; cursor:pointer;
}
.btn-rev:hover{background:var(--accent-2)}
.btn-rev:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.marcas{display:flex; gap:6px; margin-left:auto}
.mark{
  font-family:var(--mono); font-size:11px; letter-spacing:.03em;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  border-radius:999px; padding:6px 11px; cursor:pointer;
}
.mark[aria-pressed="true"][data-m="sabe"]{background:var(--sabe-soft); border-color:var(--sabe); color:var(--sabe)}
.mark[aria-pressed="true"][data-m="revisar"]{background:var(--revisar-soft); border-color:var(--revisar); color:var(--revisar)}

.resposta{
  margin-top:22px; padding:20px 22px; border-radius:10px;
  background:var(--surface-2); border:1px solid var(--line);
  border-left:3px solid var(--accent);
}
@media (max-width:480px){ .resposta{padding:16px 15px} }
.resposta h4{
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin:0 0 12px;
}
.resposta p{margin:0 0 12px; font-size:15.5px; line-height:1.62}
.resposta ul{margin:0 0 12px; padding-left:20px; display:flex; flex-direction:column; gap:7px}
.resposta li{font-size:15.5px; line-height:1.55}
.resposta > :last-child{margin-bottom:0}
.resposta .tema-rev{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-3);
  margin:16px 0 0; padding-top:12px; border-top:1px solid var(--line);
}
.resposta strong{font-weight:600}
.resposta em{font-style:italic; color:var(--ink-2)}

/* ---------- navegação fixa ---------- */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.nav-in{max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:center}
.nav button{
  font-family:var(--disp); font-weight:600; font-size:13.5px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:8px; padding:10px 18px; cursor:pointer;
}
.nav button:hover:not(:disabled){border-color:var(--line-2)}
.nav button:disabled{opacity:.4; cursor:default}
.nav button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.nav .dica{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; color:var(--ink-3);
  margin:0 auto; text-align:center;
}
@media (max-width:560px){ .nav .dica{display:none} .nav-in button{flex:1} }

.vazio{
  text-align:center; padding:60px 20px; color:var(--ink-2); font-size:15px;
}
.rodape{
  max-width:820px; margin:0 auto; padding:22px 16px 0;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em;
  color:var(--ink-3); line-height:1.7;
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<div class="bar">
  <div class="bar-in">
    <div class="brand">Banco de Questões <small>PQS · Processos de Software</small></div>
    <div class="seg" id="segTipo" role="group" aria-label="Filtrar por tipo">
      <button type="button" data-t="todas" aria-pressed="true">Todas</button>
      <button type="button" data-t="pratica" aria-pressed="false">Práticas</button>
      <button type="button" data-t="teorica" aria-pressed="false">Teóricas</button>
      <button type="button" data-t="revisar" aria-pressed="false">Revisar</button>
    </div>
    <select id="selTema" aria-label="Filtrar por tema"></select>
    <button type="button" class="ico" id="btnShuffle" title="Sortear nova ordem">↺ Sortear</button>
    <button type="button" class="ico" id="btnTema" title="Alternar tema claro/escuro">◐</button>
  </div>
  <div class="progress"><i id="barra"></i></div>
</div>

<main id="palco"></main>

<div class="rodape" id="rodape"></div>

<div class="nav">
  <div class="nav-in">
    <button type="button" id="btnPrev">← Anterior</button>
    <span class="dica">← → navega · Espaço revela a resposta</span>
    <button type="button" id="btnNext">Próxima →</button>
  </div>
</div>

<script>
// Banco de questões — Processos de Desenvolvimento de Software
// Base: resumos das aulas do Prof. Gilleanes Guedes / Prof. João Pablo Silva da Silva
// (Wazlawick 2013, Sommerville 2011, Pressman)

// Unidades na ordem do curso. Cada Unidade mapeia para uma única Prova, e seus
// temas (um por Aula, na ordem das videoaulas) são os únicos válidos para as
// questões dela. Nas aulas que apresentam um Processo-alvo, "alvo" diz qual é:
// as práticas desse alvo ficam nessa aula. "praticasPorAlvo" é quantas práticas
// cada Processo-alvo da Unidade tem. Checagem: node scripts/checar-dados.js
window.UNIDADES = [
  { nome: "Fundamentos", prova: "Prova 1", praticasPorAlvo: 2, temas: [
    { nome: "Fundamentos — conceitos de processo de software" }
  ]},
  { nome: "Prescritivos", prova: "Prova 1", praticasPorAlvo: 2, temas: [
    { nome: "Prescritivos I — cascata e modelos V e W" },
    { nome: "Prescritivos II — espiral e evolucionários" },
    { nome: "Prescritivos III — entregas, formal e reuso" },
    { nome: "Iterativos e incrementais — UP" }
  ]},
  { nome: "Ágeis", prova: "Prova 2", praticasPorAlvo: 4, temas: [
    { nome: "Ágeis I — introdução e Manifesto" },
    { nome: "Ágeis II — FDD", alvo: "FDD" },
    { nome: "Ágeis III — DSDM", alvo: "DSDM" },
    { nome: "Ágeis IV — Crystal Clear", alvo: "Crystal Clear" },
    { nome: "Ágeis V — ASD", alvo: "ASD" },
    { nome: "Ágeis VI — XP", alvo: "XP" },
    { nome: "Ágeis VII — Scrum: papéis e artefatos", alvo: "Scrum" },
    { nome: "Ágeis VIII — Scrum: pilares e eventos" }
  ]}
];

window.QUESTOES = [

/* ============================ PRÁTICAS ============================ */

{
  id: "P01", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", alvo: "Desenvolvimento orientado a reuso",
  bullets: [
    "O cliente tem urgência na conclusão do projeto;",
    "Todavia os requisitos não possuem uma grande complexidade;",
    "A empresa já possui uma base de ativos de software e alguns deles possuem alguma semelhança com os requisitos solicitados;",
    "Além disso, muitos requisitos parecem poder ser atendidos, pelo menos parcialmente, por componentes ou bibliotecas disponíveis externamente;",
    "Em um primeiro momento, devido à urgência, o cliente parece estar disposto a ser flexível com relação aos requisitos."
  ],
  resposta: `
    <p><strong>Desenvolvimento orientado a reuso.</strong></p>
    <ul>
      <li><em>Urgência</em> — o reuso reduz drasticamente a quantidade de software a ser efetivamente desenvolvida, com custos e riscos menores e conclusão muito mais rápida.</li>
      <li><em>Requisitos de baixa complexidade</em> — quanto menor a complexidade, maior a chance de os componentes disponíveis cobrirem o que se pede.</li>
      <li><em>Base de ativos + componentes externos</em> — as duas condições exigidas pelo processo estão satisfeitas: ampla base de componentes reutilizáveis e infraestrutura de integração.</li>
      <li><em>Cliente flexível</em> — é a condição decisiva, pois o estágio 2 do processo é justamente a <strong>modificação dos requisitos</strong>: comparar o pedido com o que os componentes oferecem e alterar os requisitos para refletir o disponível.</li>
    </ul>
    <p><strong>Estágios:</strong> análise de componentes → modificação dos requisitos → projeto de sistema com reuso → desenvolvimento e integração.</p>
    <p><strong>Ressalvas a declarar:</strong> adequar o que o cliente quer ao que os componentes fazem pode gerar um sistema que não atende de fato às necessidades dele (principal defeito do modelo); e há risco de <em>comportamentos emergentes</em> ao integrar componentes de fabricantes diferentes ou COTS mal configurados — funcionalidades não usadas devem ser explicitamente desabilitadas.</p>
    <p><strong>Por que não a linha de produto de software:</strong> a SPL pressupõe uma família de produtos do mesmo segmento (no mínimo três) e um núcleo de ativos próprio, planejado e reaproveitado de forma sistemática; aqui há um único sistema urgente, montado de forma oportunista a partir de ativos com alguma semelhança e de componentes externos.</p>`
},

{
  id: "P02", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", alvo: "Desenvolvimento orientado a reuso",
  bullets: [
    "A empresa precisa entregar um marketplace completo em três meses;",
    "Existem bibliotecas e componentes de código livre maduros para catálogo, carrinho, meio de pagamento e busca;",
    "Da mesma forma, a empresa já possui componentes próprios de autenticação e de emissão de relatórios, usados em projetos anteriores;",
    "A infraestrutura de integração da empresa já está montada e em uso;",
    "O cliente declarou preferir um sistema no ar em três meses a um sistema sob medida em um ano."
  ],
  resposta: `
    <p><strong>Desenvolvimento orientado a reuso.</strong></p>
    <p>O cenário satisfaz literalmente as <strong>duas condições</strong> que o processo exige para funcionar: uma ampla base de componentes reutilizáveis (livres e próprios) e uma infraestrutura de integração já operante.</p>
    <p>A última afirmação é a chave: ao preferir prazo a sob medida, o cliente autoriza antecipadamente o estágio de <strong>modificação dos requisitos</strong> — os requisitos são comparados ao que os componentes oferecem e alterados para refletir o disponível. Se não for possível alterá-los, volta-se à análise de componentes em busca de alternativas ou decide-se desenvolver componentes novos.</p>
    <p><strong>Vantagens acionadas:</strong> redução drástica do software a desenvolver, custos e riscos menores, conclusão muito mais rápida — exatamente o que o prazo de três meses exige.</p>
    <p><strong>Cuidados:</strong> risco de o sistema não atender de fato às necessidades do cliente; risco de comportamentos emergentes na integração de componentes de origens diferentes. Observação do professor: o reuso deve ser aplicado sempre que possível, mas um processo <em>totalmente</em> orientado a reuso nem sempre é a melhor escolha.</p>
    <p><strong>Por que não o modelo orientado a ferramentas:</strong> ele gera código a partir de especificações de alto nível e fica restrito ao que as ferramentas produzem; aqui o ganho de prazo vem de montar o sistema com componentes prontos — livres e próprios — e o preço que o cliente aceita é a modificação dos requisitos, não o limite de uma ferramenta.</p>`
},

{
  id: "P03", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", alvo: "Linha de produto de software (SPL)",
  bullets: [
    "A empresa já entregou quatro sistemas de gestão para clínicas odontológicas diferentes;",
    "Cerca de 70% das funcionalidades se repetem de um sistema para outro;",
    "Há previsão de pelo menos mais seis clientes do mesmo segmento nos próximos dois anos;",
    "Hoje cada novo cliente é atendido copiando o código do projeto anterior e adaptando na mão;",
    "A diretoria aceita reorganizar equipes, processos, arquitetura e a forma de vender."
  ],
  resposta: `
    <p><strong>Linha de Produto de Software (LPS / SPL).</strong></p>
    <p>É a evolução estratégica do reuso: uma <strong>família de softwares</strong> que compartilham características comuns, gerenciada para atender a um segmento específico de mercado e construída a partir de um <strong>núcleo comum reaproveitado de forma sistemática</strong>. Aqui o reuso deixa de ser oportunista (o copiar-e-colar atual) e passa a ser incorporado ao próprio processo de desenvolvimento.</p>
    <p><strong>Por que compensa:</strong> há no mínimo três produtos relacionados na mesma área — o critério mínimo — e na verdade quatro entregues e seis previstos. A partir daí é possível gerenciar versões, otimizar o processo produtivo, e o custo fica abaixo do desenvolvimento convencional.</p>
    <p><strong>Por que a última afirmação importa:</strong> implantar uma SPL não é decisão apenas técnica. Exige mudanças na gerência do processo, na forma de desenvolver, na organização estrutural e de pessoal, na abordagem de negócio e na concepção arquitetônica dos produtos. Sem esse aval, a adoção fracassa.</p>
    <p><strong>Três atividades essenciais:</strong> desenvolvimento do núcleo de ativos (com identificação dos <em>pontos de variação</em> e diretrizes de reúso), desenvolvimento de produtos (entradas: descrição do produto, escopo da linha, núcleo de ativos, plano de produção) e gerência (organizacional e técnica).</p>
    <p><strong>Não confundir com o desenvolvimento orientado a reuso:</strong> ali um único sistema é montado a partir de componentes disponíveis, adaptando os requisitos ao que existe; aqui o problema é uma família de produtos que se repete — copiar e adaptar a cada cliente é justamente o reuso oportunista que a SPL substitui por um núcleo de ativos planejado.</p>`
},

{
  id: "P04", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos III — entregas, formal e reuso", alvo: "Linha de produto de software (SPL)",
  bullets: [
    "Fabricante de máquinas agrícolas produz o firmware de cinco linhas de colheitadeiras;",
    "As linhas compartilham um núcleo de funcionalidades e diferem em sensores, potência e painéis;",
    "Estão previstas mais três linhas nos próximos anos;",
    "Hoje cada linha tem seu repositório próprio e uma correção precisa ser reaplicada manualmente em cinco lugares;",
    "A empresa está disposta a rever a arquitetura dos produtos e a estrutura das equipes."
  ],
  resposta: `
    <p><strong>Linha de Produto de Software (SPL).</strong></p>
    <p>O caso é o exemplo canônico: um conjunto de sistemas que compartilham características comuns — uma família de softwares — voltada a um <strong>segmento específico de mercado</strong> e construída sobre um <strong>núcleo comum</strong>, com variações previstas.</p>
    <p><strong>Critérios de decisão atendidos:</strong> há cinco produtos relacionados na mesma área (mínimo é três), com previsão de mais três; os produtos permitem ativos comuns; e é possível gerenciar versões e otimizar o processo produtivo, deixando o custo abaixo do desenvolvimento convencional.</p>
    <p>A correção reaplicada cinco vezes é o sintoma exato que o <strong>núcleo de ativos</strong> resolve: construir o conjunto de elementos reutilizáveis, identificar os <strong>pontos de variação</strong> (sensores, potência, painéis — o que muda de um reúso para outro) e produzir diretrizes sobre como reusar cada ativo.</p>
    <p><strong>Não confundir com o desenvolvimento orientado a reuso:</strong> ali monta-se um sistema a partir de componentes de terceiros, adaptando requisitos ao disponível; aqui o reuso é planejado, próprio e sistemático, incorporado ao processo e sustentado por gerência organizacional e técnica.</p>`
},

    <p><strong>Por que não a cascata com redução de risco:</strong> ela também ataca o risco cedo, mas numa única fase de estudo antes de um processo sequencial, e parte de requisitos que se estabilizam a partir dali; aqui o risco é de viabilidade técnica, numa tecnologia nova, e precisa ser reavaliado a cada ciclo com a possibilidade de abandonar o projeto — o que só o espiral institucionaliza.</p>`

{

{

{
  id: "P15", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", alvo: "Cascata com subprojetos",

  resposta: `

    <p><strong>Vantagens acionadas pelo enunciado:</strong> subprojetos menores, mais rápidos e fáceis de gerenciar; explora melhor a modularidade; progresso mais visível; permite entregas parciais de funcionalidades conforme ficam prontas.</p>

{
  id: "P16", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", alvo: "Cascata com subprojetos",
  bullets: [
    "Sistema hospitalar com módulos bem separados: internação, farmácia, laboratório e faturamento;",
    "A arquitetura foi herdada de um projeto semelhante já concluído e é considerada adequada;",
    "A empresa tem equipes ociosas que poderiam trabalhar simultaneamente;",
    "O cliente aceita receber módulos prontos antes do sistema completo;",
    "A gerência de projetos da empresa é madura e acostumada a coordenar várias frentes."
  ],
  resposta: `
    <p><strong>Cascata com subprojetos.</strong></p>
    <p>Depois de concepção, análise de requisitos e projeto arquitetônico, o trabalho é <strong>dividido em vários subprojetos desenvolvidos em paralelo</strong>, seguidos de integração e operação. Os quatro módulos do enunciado são os subprojetos naturais.</p>
    <p><strong>Vantagens:</strong> subprojetos menores, mais rápidos e fáceis de gerenciar; melhor exploração da modularidade; progresso mais visível; entregas parciais de funcionalidades conforme ficam prontas.</p>
    <p><strong>Desvantagens neutralizadas pelo cenário:</strong> a exigência de um projeto arquitetônico muito bem feito está atendida pela arquitetura herdada e validada; a necessidade de grande capacidade de gerência, para evitar inconsistências entre subsistemas, está atendida pela gerência madura; resta vigiar as interdependências entre módulos, que podem atrasar ou impedir o paralelismo e tornar a integração final problemática.</p>
    <p><strong>Distinção pedida em prova:</strong> não é entregas em estágios — ali os ciclos são <em>sequenciais</em> e cada ciclo entrega um incremento; aqui os subprojetos correm <em>simultaneamente</em>, o que só faz sentido porque há equipes ociosas.</p>`
},

{
  id: "P17", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", alvo: "Cascata entrelaçado (sashimi)",
  bullets: [
    "Equipe pequena, experiente e trabalhando no mesmo espaço físico;",
    "Há conversa constante entre quem levanta requisitos, quem projeta e quem codifica;",
    "A empresa quer reduzir a quantidade de documentação produzida;",
    "A arquitetura é crítica para o sistema e precisa ser tratada como etapa própria;",
    "O prazo é curto e a gerência não exige marcos rígidos nem artefato aprovado por fase."
  ],
  resposta: `
    <p><strong>Cascata entrelaçado (modelo "sashimi")</strong> — assim chamado porque o diagrama de fases sobrepostas lembra um prato japonês.</p>
    <p><strong>Não é preciso encerrar totalmente uma fase para iniciar a seguinte</strong>: as fases se sobrepõem e podem correr em paralelo — concepção → análise e especificação de requisitos → projeto de arquitetura → projeto detalhado → codificação e depuração → testes de sistema.</p>
    <p><strong>Contribuição do modelo:</strong> o <strong>projeto de arquitetura</strong> como fase intermediária entre análise e projeto detalhado. A arquitetura define o esqueleto do software, apoia-se fortemente nos requisitos não funcionais e é pouco flexível a mudanças — alterá-la depois gera custos altíssimos, podendo obrigar a recomeçar o projeto. É o que atende à quarta afirmação.</p>
    <p><strong>Vantagens acionadas:</strong> uma fase só se conclui depois de consideradas questões da fase seguinte, o que gera ganho de conhecimento; as equipes de fases diferentes conversam mais, reduzindo a necessidade de documentação — só possível com equipe pequena e co-localizada.</p>
    <p><strong>Desvantagens aceitas:</strong> início e término das fases ficam pouco explícitos, dificultando estabelecer marcos e definir os artefatos entregues por fase — tolerável porque a gerência não os exige; e o paralelismo pode gerar falhas de comunicação, aceitação de hipóteses erradas e ineficiência.</p>
    <p><strong>Por que não o cascata clássico:</strong> ele obriga a concluir totalmente uma fase antes de iniciar a seguinte e se apoia em muita documentação para passar o conhecimento entre fases — o oposto da conversa constante, da redução de documentação e da ausência de marcos rígidos que o enunciado descreve.</p>`
},

{
  id: "P18", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", alvo: "Cascata entrelaçado (sashimi)",
  bullets: [

    <p>A primeira afirmação descreve literalmente o modelo: <strong>não é preciso encerrar totalmente uma fase para iniciar a seguinte</strong> — as fases se sobrepõem e podem correr em paralelo, na sequência concepção → análise e especificação de requisitos → projeto de arquitetura → projeto detalhado → codificação e depuração → testes de sistema.</p>
    <p>A quarta afirmação é a vantagem central do modelo enunciada de outra forma: <strong>uma fase só se conclui depois de consideradas questões da fase seguinte, o que gera ganho de conhecimento</strong>. A segunda afirmação habilita a outra vantagem: equipes de fases diferentes conversam mais, reduzindo a necessidade de documentação.</p>
    <p>A terceira afirmação neutraliza a principal desvantagem — início e término das fases pouco explícitos, dificultando marcos e definição de artefatos por fase.</p>
    <p><strong>Por que a última afirmação importa:</strong> ela elimina entregas em estágios, entrega evolucionária, cascata com subprojetos e Processo Unificado, todos baseados em entrega parcial de funcionalidade. O ganho de tempo aqui vem da <em>sobreposição de fases</em>, não da entrega antecipada.</p>`
},

{
  id: "P19", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", alvo: "Modelo em cascata (clássico)",
  bullets: [
    "Reimplementação de um sistema legado em nova plataforma, com comportamento idêntico ao atual;",
    "O sistema atual está completamente documentado e em produção há quinze anos;",
    "Nenhum requisito novo será aceito durante o projeto;",
    "O cliente não tem disponibilidade para participar do desenvolvimento nem para avaliar versões intermediárias;",
    "Contrato de escopo e preço fechados, com entrega única ao final."
  ],
  resposta: `
    <p><strong>Modelo em cascata (clássico).</strong></p>
    <p><strong>Fases (versão de Wazlawick):</strong> levantamento de requisitos do sistema → levantamento de requisitos de software → análise de requisitos → projeto → codificação → testes → operação/implantação. As três primeiras equivalem à atual engenharia de requisitos; a análise busca ambiguidades, incompletudes e conflitos.</p>
    <p><strong>Por que é defensável aqui:</strong> a principal objeção ao cascata é <em>exigir que todos os requisitos sejam declarados em detalhe logo no início</em>, o que geralmente é impossível porque clientes e stakeholders têm necessidades vagas e nem conseguem conceber tudo o que o software poderia fazer. Nesse cenário a objeção está neutralizada: os requisitos já existem, documentados e validados por quinze anos de operação. As demais afirmações eliminam qualquer modelo baseado em participação do cliente ou entrega parcial.</p>
    <p><strong>Riscos que permanecem e devem ser citados:</strong> erros de especificação só aparecem na implantação, quando o custo de correção é altíssimo; algumas atividades poderiam ser paralelizadas, mas o modelo não permite; e o software só é implantado ao final de todo o ciclo.</p>
    <p><strong>Por que não a cascata dupla:</strong> o retorno à fase anterior serve para corrigir erros descobertos ao longo do processo, sobretudo de especificação; aqui os requisitos estão documentados e validados por quinze anos de operação e nenhum requisito novo será aceito, de modo que o cascata clássico já basta.</p>`
},

{
  id: "P20", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", alvo: "Modelo em cascata (clássico)",
  bullets: [
    "Sistema de folha de pagamento cujas regras vêm integralmente de legislação e convenção coletiva publicadas;",
    "Nenhum requisito depende de interpretação ou preferência do cliente;",

  resposta: `
    <p><strong>Modelo em cascata (clássico).</strong></p>
    <p>O modelo se caracteriza por <strong>fases rígidas, muita documentação e obrigatoriedade de concluir totalmente uma fase antes de iniciar a próxima</strong> — que é exatamente o que a auditoria exige na terceira afirmação.</p>
    <p><strong>Por que as objeções usuais não se aplicam:</strong></p>
    <ul>
      <li>"Exige que todos os requisitos sejam declarados em detalhe logo no início" — possível aqui, pois derivam de legislação publicada e não de necessidades vagas do cliente;</li>
      <li>"O software só é implantado ao final de todo o ciclo" — irrelevante, já que a folha só tem valor completa;</li>
      <li>"Muita documentação" — aqui é vantagem, pois é o meio de transmissão de conhecimento numa equipe rotativa.</li>
    </ul>
    <p><strong>Riscos remanescentes:</strong> erros de especificação aparecendo apenas na implantação, com custo altíssimo de correção, e impossibilidade de paralelizar atividades. Se a empresa quiser mitigar o primeiro sem abrir mão da estrutura, a variação natural é a cascata dupla.</p>
    <p><strong>Por que não o cascata entrelaçado:</strong> sobrepor as fases deixaria início e término pouco explícitos e reduziria a documentação — o oposto da aprovação do documento de cada fase antes da seguinte, exigida pela auditoria, e da documentação formal de que a equipe rotativa depende.</p>`
},

{
  id: "P21", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", alvo: "Cascata dupla",
  bullets: [
    "Projeto contratualmente obrigado a seguir fases sequenciais, sem entregas parciais;",
    "Os requisitos são razoavelmente conhecidos, mas o domínio é jurídico e há termos que geram interpretações divergentes;",
    "O histórico da empresa mostra erros detectados na análise que tiveram origem no levantamento, e erros de projeto com origem na análise;",
    "A equipe precisa de um mecanismo formal para voltar à fase anterior e corrigir a origem do erro;",
    "O cliente não aceita protótipos nem estudos prévios antes do início do desenvolvimento."
  ],
  resposta: `
    <p><strong>Cascata dupla.</strong></p>
    <p>É a evolução quase imediata do cascata clássico: <strong>permite retornar à fase anterior quando um erro é descoberto</strong> — da análise para o levantamento, do projeto para a análise, e assim por diante. Na prática, muitas vezes é preciso voltar várias fases: dos testes ao projeto, do projeto ao levantamento.</p>
    <p>A quarta afirmação pede literalmente esse mecanismo, e a terceira descreve os retornos que o modelo prevê.</p>
    <p><strong>Por que não a cascata com redução de risco:</strong> ela exigiria uma fase prévia de estudo com protótipos, storyboards, entrevistas repetidas ou filmagem dos usuários — e a última afirmação a proíbe.</p>
    <p><strong>O que o modelo melhora e o que não resolve:</strong> melhora a detecção precoce de erros, mas <strong>não resolve o problema de fundo</strong> — o software final continua sendo entregue só no fim. É também aqui que aparece o <em>problema da linguagem</em>: "não falamos a mesma língua, falamos dialetos semelhantes"; termos mudam de significado entre áreas, regiões e faixas etárias — precisamente o caso do vocabulário jurídico da segunda afirmação.</p>`
},

{
  id: "P22", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos I — cascata e modelos V e W", alvo: "Cascata dupla",
  bullets: [
    "Empresa de pequeno porte, projeto sequencial, sem condições de manter equipes paralelas;",
    "Os requisitos foram levantados com o cliente e estão razoavelmente estáveis;",

    "A equipe quer apenas poder corrigir a fase de origem quando um erro for descoberto em fase posterior;",

    <p><strong>Limite a declarar:</strong> o modelo melhora a detecção precoce de erros, mas o software final continua sendo entregue só no fim, e erros de especificação ainda podem aparecer na implantação com custo alto de correção.</p>`
},

{
  id: "P23", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", alvo: "Desenvolvimento evolucionário exploratório",
  bullets: [
    "Sistema pequeno, sem contrato formal e sem exigência de documentação;",
    "O cliente está disponível diariamente e trabalha lado a lado com a equipe;",
    "Parte do sistema é bem compreendida desde já; o restante vai surgindo conforme o cliente usa o que foi entregue;",
    "O cliente propõe novas características a cada semana, a partir do que experimenta;",
    "O prazo é curto e a vida útil prevista do sistema também."
  ],
  resposta: `
    <p><strong>Desenvolvimento evolucionário, na variação exploratória.</strong></p>
    <p>O modelo parte de uma <strong>descrição em esboço</strong> do software e executa especificação, desenvolvimento e validação <strong>de forma concorrente</strong>, produzindo uma versão inicial, várias intermediárias e, por fim, a versão final; cada implementação é exposta ao usuário e aprimorada conforme o retorno.</p>
    <p>A variação <strong>exploratória</strong> é a que o enunciado descreve: trabalha intensamente com o cliente, <strong>começa pelas partes do sistema mais bem compreendidas</strong> e evolui com <strong>novas características propostas pelo cliente</strong>, até entregar o sistema final. As afirmações 2, 3 e 4 são essa definição, item por item.</p>
    <p><strong>Pontos positivos:</strong> atende às necessidades do cliente de forma mais imediata que o cascata; gera menos documentação e permite especificação gradual; é precursor dos modelos ágeis e iterativo-incrementais.</p>
    <p><strong>Por que é aceitável aqui:</strong> os três problemas do modelo — progresso pouco visível, pouca documentação e estrutura degradada — pesam pouco em um sistema pequeno, sem contrato, de prazo curto e vida útil curta. Para sistemas pequenos, e com bem mais risco médios, a abordagem é alternativa; para grande porte e longo tempo de vida é inviável. Risco permanente: degenerar no clássico "desenvolver e corrigir".</p>
    <p><strong>Por que não a variação com protótipos descartáveis:</strong> ela gera protótipos para compreender os requisitos <em>mal</em> entendidos e depois os descarta; aqui o sistema começa pelo que já é bem compreendido e cada versão entregue é o próprio produto, que evolui com as características que o cliente propõe.</p>`
},

{
  id: "P24", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", alvo: "Desenvolvimento evolucionário exploratório",
  bullets: [

    <p>Especificação, desenvolvimento e validação ocorrem de forma concorrente, a partir de uma descrição em esboço, com cada versão exposta ao usuário e aprimorada conforme o retorno — viável porque o usuário é o colega ao lado.</p>
    <p><strong>Por que os problemas do modelo não inviabilizam o caso:</strong></p>
    <ul>

      <li><em>Estrutura degradada</em> — o software seria entregue já desgastado, encarecendo manutenções; irrelevante para algo que será descontinuado em um ano.</li>

    <p>Trocando qualquer uma dessas três afirmações — porte maior, vida útil longa, contrato —, a resposta correta deixaria de ser esta.</p>`

{
  id: "P25", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", alvo: "Evolucionário com protótipos descartáveis",
  bullets: [
    "Sistema de médio porte com cerca de 80% dos requisitos bem compreendidos e fechados;",
    "Três ou quatro requisitos são mal compreendidos e geram divergência entre os stakeholders;",
    "A arquitetura precisa permanecer estável desde cedo;",
    "A equipe não admite que código improvisado entre no produto final;",
    "Há tempo e disposição dos stakeholders para avaliar experimentos antes de fechar esses requisitos."
  ],
  resposta: `
    <p><strong>Desenvolvimento evolucionário na variação com protótipos descartáveis.</strong></p>
    <p>Nessa variação, geram-se muitos protótipos com o objetivo de <strong>compreender os requisitos</strong>, experimentando justamente aqueles <strong>mal entendidos</strong>; os protótipos são <strong>apresentados aos stakeholders e ajustados conforme os pareceres</strong>. As afirmações 2 e 5 são essa definição.</p>
    <p><strong>Por que "descartáveis" e não "evolucionária":</strong> as afirmações 3 e 4 proíbem que o protótipo vire produto. Na <em>prototipação evolucionária</em> (cornerstone) o protótipo passa a fazer parte do sistema final; aqui isso corromperia a arquitetura e reproduziria o problema da <strong>estrutura degradada</strong> — alterações constantes sem refatoração adequada, com software entregue já desgastado.</p>
    <p><strong>Por que não o exploratório:</strong> ele começa pelas partes <em>mais bem compreendidas</em> e evolui com novas características propostas pelo cliente; aqui o problema é o oposto — um subconjunto pequeno e mal entendido, com os outros 80% já fechados.</p>
    <p><strong>Alternativa defensável:</strong> cascata com redução de risco, se o contrato exigir estrutura sequencial — a fase prévia de redução de risco usaria protótipos de interface e storyboards com o mesmo propósito.</p>`
},

{
  id: "P26", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", alvo: "Evolucionário com protótipos descartáveis",
  bullets: [
    "O módulo de cálculo de comissões gera divergência aberta entre a diretoria comercial e a financeira;",
    "Todos os demais requisitos do sistema já estão fechados e validados;",
    "A empresa quer testar hipóteses com os dois grupos antes de decidir a regra definitiva;",
    "Nada do que for construído para esse teste deve ser aproveitado no produto;",
    "O cronograma do restante do sistema não pode ser afetado por essa indefinição."
  ],
  resposta: `
    <p><strong>Desenvolvimento evolucionário com protótipos descartáveis</strong>, aplicado apenas ao módulo problemático.</p>
    <p>A variação existe exatamente para isso: gerar protótipos <strong>com o objetivo de compreender os requisitos</strong>, experimentando os que estão mal entendidos, apresentá-los aos stakeholders e ajustá-los conforme os pareceres. A quarta afirmação — nada do que for construído deve ser aproveitado — é o que torna os protótipos <em>descartáveis</em> por definição.</p>
    <p><strong>Por que não a prototipação evolucionária:</strong> nela os protótipos são desenvolvidos com seriedade, planejamento e cuidado justamente porque <strong>passam a fazer parte do sistema final</strong> — o oposto do que o enunciado determina.</p>
    <p><strong>Por que a quinta afirmação não muda a resposta:</strong> o protótipo descartável isola a indefinição em uma frente paralela de investigação; o restante do sistema, já fechado e validado, segue seu curso. É a diferença entre usar prototipação como <em>técnica de elicitação</em> e adotá-la como processo de desenvolvimento do produto inteiro.</p>`
},

{
  id: "P27", tipo: "pratica", unidade: "Prescritivos", tema: "Prescritivos II — espiral e evolucionários", alvo: "Prototipação evolucionária",
  bullets: [
    "Sistema pequeno de agendamento para uma clínica;",
    "O cliente domina o próprio trabalho, mas não consegue expressá-lo em forma de requisito;",
    "As conversas só rendem quando ele vê telas e reage a elas;",
    "A equipe também não conhece o domínio;",
    "A empresa aceita que a versão aprovada pelo cliente se torne o produto entregue, e o prazo é folgado."
  ],
  resposta: `
    <p><strong>Prototipação evolucionária</strong>, baseada na <em>prototipação cornerstone</em>: protótipos desenvolvidos <strong>com seriedade, planejamento e cuidado, que passam a fazer parte do sistema final</strong> — é o que a quinta afirmação autoriza.</p>
    <p><strong>Fluxo:</strong> concepção inicial → projeto e implementação do protótipo → teste; se não for aceitável, refina-se em novo ciclo; se for aceitável, o software é finalizado e liberado. A equipe trabalha com o cliente principalmente sobre os <strong>aspectos visíveis do sistema</strong> (a interface) — exatamente o que destrava a comunicação na terceira afirmação.</p>
    <p><strong>Quando é vantajosa — e as duas condições aparecem no enunciado:</strong> cliente com dificuldade de comunicar seus requisitos (situação bastante frequente) e desconhecimento dos requisitos tanto pela equipe quanto pelo cliente.</p>
    <p><strong>Cuidados e desvantagens:</strong> é difícil prever o tempo de desenvolvimento e saber se o processo avança a contento (por isso o prazo folgado é essencial); é difícil identificar quando cada fase realmente terminou; pode degenerar no modelo "codificar e consertar"; e é preciso analisar os requisitos e produzir um projeto realista <strong>antes</strong> de iniciar a codificação.</p>

      <li><strong>Dirigido por casos de uso</strong> — a equipe modela em UML; os casos de uso definem todas as funcionalidades, identificam requisitos funcionais e atores, auxiliam na definição e validação da arquitetura e no planejamento das iterações, e embasam casos de teste e documentação.</li>

{
