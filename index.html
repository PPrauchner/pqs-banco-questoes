      <li><strong>Afirmação 5</strong> — afasta um dos casos em que o DSDM não é apropriado: ênfase muito grande em segurança exige testes, verificações e validações em vários níveis, o que colide com o objetivo de cumprir prazos e orçamentos.</li>
      <li><strong>Afirmação 6</strong> — atende às condições de requisitos claros e decomponíveis em módulos.</li>
    </ul>
    <p><strong>Por que não o FDD:</strong> o FDD tem outros custos — demanda muitas tarefas, atividades e papéis, por isso não funciona bem com equipes pequenas; gera grande produção de documentação nas primeiras fases; e depende muito das decisões dos programadores líderes. É voltado a projetos grandes e complexos. O limite que este projeto aceita é outro: deixar requisitos de fora para caber no prazo e no orçamento fixados — o <em>timeboxing</em> do DSDM.</p>`

{
  id: "T52", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis III — DSDM", bullets: [],
  pergunta: "Quais são as fases do DSDM? Descreva os estágios do ciclo de vida do projeto.",
  resposta: `
    <p>O DSDM tem <strong>três fases</strong>:</p>
    <ul>
      <li><strong>Pré-projeto</strong> — identificação inicial do projeto, negociação dos requisitos, definição do orçamento e <strong>assinatura do contrato</strong>.</li>
      <li><strong>Ciclo de vida do projeto</strong> — o processo propriamente dito, a parte mais importante do DSDM.</li>
      <li><strong>Pós-projeto</strong> — o software passa a ser utilizado plenamente, ocorrem manutenções e já se pensa na evolução, que no DSDM é considerada <strong>continuação do processo de desenvolvimento</strong>.</li>
    </ul>
    <p>O ciclo de vida tem <strong>cinco estágios</strong>:</p>
    <ol>
      <li><strong>Estudo de viabilidade</strong> — determina se é viável desenvolver o software; se não for, o projeto é encerrado. Saídas: relatório de viabilidade, protótipo inicial de viabilidade, plano de desenvolvimento e controle de risco.</li>
      <li><strong>Estudo de negócio</strong> — estuda a organização a que o software se destina e as tecnologias mais adequadas; produz a priorização dos requisitos e a arquitetura inicial (<em>timeboxing</em>, MoSCoW, princípio de Pareto).</li>
      <li><strong>Iteração do modelo funcional</strong> — identificar o protótipo funcional, acordar plano de tarefas, criar e revisar o protótipo funcional (com avaliação do usuário final).</li>
      <li><strong>Iteração de projeto e construção</strong> — identificar os requisitos funcionais e não funcionais do sistema final, acordar plano de tarefas, criar um protótipo de projeto já utilizável e testável, e revisá-lo, gerando a documentação para usuário e as evidências de que os testes foram aprovados.</li>
      <li><strong>Implementação</strong> — aprovação do usuário e diretrizes, treinamento dos usuários, implementar (sistema entregue) e revisar aspectos do negócio.</li>
    </ol>
    <p>Os três últimos estágios são <strong>conjuntos de iterações</strong>, cada um com quatro passos que podem se repetir muitas vezes. Se necessário, volta-se da implementação ao estudo de negócio ou à iteração do modelo funcional; se o software for considerado concluído, passa-se ao pós-projeto.</p>`
},

{
  id: "T53", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis III — DSDM", bullets: [],
  pergunta: "Quais são os papéis do DSDM e as responsabilidades de cada um?",
  resposta: `
    <ul>
      <li><strong>Campeão do projeto</strong> — equivale a um gerente executivo: pessoa com capacidade de administrar prazos e tomar decisões; garante que o software será entregue no prazo.</li>
      <li><strong>Visionário</strong> — determina se os requisitos iniciais são adequados para que o projeto inicie; age como uma espécie de <strong>engenheiro do processo</strong>, mantendo as atividades de acordo com a filosofia do DSDM.</li>
      <li><strong>Intermediador</strong> — interface da equipe de desenvolvimento com clientes, usuários e especialistas de domínio.</li>
      <li><strong>Anunciante</strong> — papel <strong>opcional</strong>, mas importante: qualquer usuário que traga um ponto de vista ou informações úteis ao projeto, preferencialmente de forma diária.</li>
      <li><strong>Gerente de projeto</strong> — gerencia as atividades do projeto, cumprindo prazos e mantendo orçamento e qualidade.</li>
      <li><strong>Coordenador técnico</strong> — responsável pelo projeto da arquitetura do sistema e seus aspectos técnicos; a arquitetura é o "esqueleto" do software.</li>
      <li><strong>Líder de equipe</strong> — desenvolvedor com a função especial de manter a equipe motivada e em harmonia.</li>
      <li><strong>Desenvolvedor</strong> — transforma os requisitos e modelos em código.</li>
      <li><strong>Testador</strong> — responsável pelos testes do sistema.</li>
      <li><strong>Escrivão</strong> — registra os requisitos identificados e as decisões tomadas ao longo do projeto.</li>
      <li><strong>Facilitador</strong> — garante um ambiente de trabalho adequado e avalia o progresso das equipes.</li>
    </ul>`
},

{
  id: "T54", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis III — DSDM", bullets: [],
  pergunta: "Como o DSDM garante o prazo e o orçamento fixos no estudo de negócio, e que preço o projeto paga por isso?",
  resposta: `
    <p>No <strong>estudo de negócio</strong>, o DSDM produz a priorização dos requisitos com três técnicas:</p>

      <li><strong>MoSCoW</strong> — <em>Must</em>: essenciais, devem ser desenvolvidos; <em>Should</em>: desejáveis, deveriam ser feitos, mas podem ficar para uma 2ª versão; <em>Could</em>: opcionais, o impacto de não desenvolvê-los é pequeno; <em>Would</em>: fora do escopo, não deverão ser desenvolvidos.</li>
      <li><strong>Princípio de Pareto</strong> — 20% dos requisitos correspondem a 80% do software; desenvolvendo os mais importantes já se satisfaz razoavelmente o cliente, com um produto minimamente viável.</li>

    <p><strong>O preço:</strong> com prazo e orçamento fixos, <strong>requisitos menos importantes poderão não ser desenvolvidos</strong> — daí a importância da priorização. Sem requisitos claros e priorizáveis, o projeto tende a ultrapassar o prazo e o orçamento.</p>
    <p><strong>Outro custo, apontado pelo professor:</strong> a filosofia do DSDM pede envolvimento do usuário durante todo o projeto, mas isso nem sempre é viável — destacar um usuário-chave em tempo integral pode ser economicamente inviável para a empresa.</p>`

      <li><strong>Pequenos projetos focados</strong> — menores e mais simples, com objetivos claros e escopo bem definido; a flexibilidade do processo é importante em ambientes de ritmo acelerado e rápida mudança.</li>
      <li><strong>Equipes colaborativas</strong> — o processo depende de comunicação e colaboração eficazes; é boa opção para equipes que trabalham bem juntas e estão abertas a novas ideias.</li>
      <li><strong>Projetos complexos com escopo bem definido</strong> — embora não seja adequado a projetos grandes e complexos, pode ser efetivo quando há objetivos claros e escopo definido, ajudando a equipe a ficar focada e a se adaptar a mudanças.</li>
      <li><strong>Equipes com experiência ágil limitada</strong> — é relativamente leve e fácil de entender, boa alternativa para iniciar nos princípios e práticas ágeis.</li>
    </ul>
    <p><strong>Quando não usar:</strong></p>
    <ul>
      <li>Equipes com <strong>mais de 8 desenvolvedores</strong> (alguns autores: 10) ou projetos de <strong>risco maior que relativamente pequeno</strong> — a própria família Crystal indica um método mais formal: Yellow (até 20, pequenas perdas financeiras), Orange (até 40, grandes perdas financeiras), Red (até 80, perda de vidas), Maroon, Sapphire.</li>
      <li>Projetos <strong>grandes e complexos</strong> sem escopo bem definido.</li>
      <li>Projetos com <strong>requisitos ou restrições rígidas</strong>, que tolhem a flexibilidade e a adaptabilidade do processo.</li>
      <li>Organizações cuja <strong>liderança não adere</strong> à metodologia e não garante apoio e recursos — por exemplo, a disponibilidade dos usuários-chave.</li>
    </ul>`

    <p>Segundo Wazlawick (2013), o ciclo de vida organiza-se em <strong>três níveis aninhados</strong>:</p>
    <ul>
      <li><strong>Projeto</strong> — formado pelo conjunto de todas as entregas;</li>
      <li><strong>Entrega</strong> — composta por várias iterações; entrega funcionalidades úteis ao cliente em <strong>no máximo dois meses</strong> (pilar das entregas frequentes);</li>
      <li><strong>Iteração</strong> — dura poucas semanas, em geral, e é composta por três subfases.</li>
    </ul>
    <p><strong>Subfases de cada iteração:</strong></p>
    <ol>
      <li><strong>Estimação</strong> — análise do que precisa ser feito, determinando a complexidade do que será desenvolvido, entre outras características;</li>
      <li><strong>Desenvolvimento</strong> — a implementação propriamente dita;</li>
      <li><strong>Celebração</strong> — conferência de que as funcionalidades desenvolvidas estão corretas; elas são então dadas como concluídas.</li>
    </ol>`

{
  id: "T58", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis IV — Crystal Clear", bullets: [],
  pergunta: "Quais são os papéis do Crystal Clear? Diferencie papéis reais e papéis virtuais.",
  resposta: `
    <p><strong>Papéis reais</strong> — responsabilidades tangíveis e específicas que os indivíduos assumem no projeto; são mais tradicionais e orientados a tarefas:</p>
    <ul>
      <li><strong>Desenvolvedor</strong> — codifica o software;</li>
      <li><strong>Projetista ou arquiteto</strong> — faz a análise e o projeto e estabelece a arquitetura;</li>
      <li><strong>Testador ou especialista de qualidade</strong> — testa o software e garante sua qualidade;</li>
      <li><strong>Gerente ou coordenador</strong> — gerencia o projeto, verifica se os passos estão sendo seguidos e tenta mitigar riscos;</li>
      <li><strong>Patrocinador ou cliente</strong> — quem solicita o software;</li>
      <li><strong>Usuário ou usuário final</strong> — entre outros papéis possíveis.</li>
    </ul>
    <p><strong>Papéis virtuais</strong> — responsabilidades ou tarefas <strong>assumidas temporariamente</strong> pelos membros da equipe, com base nas necessidades do projeto. São mais fluidos e adaptáveis e surgem quando um membro precisa assumir uma tarefa adicional que não se encaixa nas definições dos papéis tradicionais. Exemplo: um desenvolvedor assume temporariamente a condução de entrevistas com os usuários.</p>
    <p><strong>Em uma linha:</strong> o papel real é o cargo permanente, orientado a tarefas; o virtual é uma responsabilidade passageira, assumida conforme a necessidade.</p>`
},

{
  id: "T59", tipo: "teorica", unidade: "Ágeis", tema: "Ágeis IV — Crystal Clear", bullets: [],
  pergunta: "Compare o DSDM e o Crystal Clear: o que têm em comum e no que diferem?",
  resposta: `
    <p><strong>Em comum:</strong></p>
    <ul>
      <li>Ambos são ágeis que trabalham com <strong>preço ou orçamento fixo</strong> e aplicam o <strong>timeboxing</strong> — no Crystal Clear, a mesma técnica do DSDM; o DSDM é um ágil baseado em contrato, assinado ainda no pré-projeto.</li>
      <li>Ambos fazem <strong>entregas frequentes</strong> e priorizam o essencial (no DSDM, pela MoSCoW e pelo princípio de Pareto; no Crystal Clear, os componentes críticos e essenciais).</li>
      <li>Ambos dependem da <strong>disponibilidade dos usuários-chave</strong> — e nos dois isso esbarra no custo. Ressalva do professor sobre o DSDM: destacar um usuário-chave em tempo integral pode ser economicamente inviável; no Crystal Clear, a interação constante com usuários-chave pode ser vetada pela liderança por esse custo.</li>
    </ul>
    <p><strong>No que diferem:</strong></p>
    <ul>
      <li><strong>Estrutura:</strong> o DSDM tem três fases (pré-projeto, ciclo de vida, pós-projeto) e cinco estágios no ciclo de vida (viabilidade → negócio → modelo funcional → projeto e construção → implementação), os três últimos iterativos com quatro passos (identificar → acordar plano de tarefas → criar protótipo → revisar protótipo). O Crystal Clear organiza-se em projeto → entregas (até dois meses) → iterações, e cada iteração em estimação → desenvolvimento → celebração.</li>
      <li><strong>Papéis:</strong> o DSDM define onze papéis, um deles opcional (campeão do projeto, visionário, intermediador, anunciante, gerente de projeto, coordenador técnico, líder de equipe, desenvolvedor, testador, escrivão, facilitador). O Crystal Clear tem poucos papéis reais e admite <strong>papéis virtuais</strong>, assumidos temporariamente.</li>
      <li><strong>Ênfase:</strong> o DSDM busca entregar dentro do prazo e do orçamento sem perder qualidade, em projetos de cronograma curto que não aceitam grandes mudanças. O Crystal Clear é centrado em pessoas, ultraleve e "na medida", e se apoia em pilares como comunicação osmótica, foco e segurança pessoal.</li>
      <li><strong>Escala e limites:</strong> o Crystal Clear é feito para equipes de até 8 pessoas e risco relativamente pequeno, e sofre com requisitos rígidos. O DSDM não é apropriado a projetos complexos difíceis de decompor, a requisitos pouco claros ou não priorizáveis, nem a ênfase muito grande em segurança.</li>
    </ul>`

      <li><strong>Escriba</strong> — toma notas das reuniões: requisitos identificados, decisões de projeto etc.</li>
      <li><strong>Cliente</strong> — quem pede o software; deve estar <strong>sempre presente</strong>. O professor observa que isso é difícil, mas é característica geral dos processos ágeis.</li>
      <li><strong>Gerente de projeto</strong> — coordena o desenvolvimento e os desenvolvedores, mantém prazos e custos e gerencia riscos.</li>
      <li><strong>Desenvolvedores</strong> — responsáveis pela implementação propriamente dita.</li>
    </ul>
    <p>Esses papéis são os <strong>agentes</strong> do sistema adaptativo complexo que o ASD enxerga no desenvolvimento — ao lado dos <strong>ambientes</strong> (organizacional, tecnológico e de processo) e das <strong>saídas emergentes</strong> (os artefatos produzidos).</p>`
},

];

</script>
<script>
(function(){
  "use strict";
  var Q = window.QUESTOES || [];
  var CHAVE = "pqs-processos-v1";

  var estado = { tipo:"todas", tema:"todos", i:0, ordem:[], revelada:false, marcas:{} };

  function ler(){
    try{
      var raw = localStorage.getItem(CHAVE);
      if(raw){
        var o = JSON.parse(raw);
        if(o && typeof o === "object"){
          estado.marcas = o.marcas || {};
          if(o.tipo) estado.tipo = o.tipo;
          if(o.tema) estado.tema = o.tema;
        }
      }
    }catch(e){ /* armazenamento indisponível */ }
  }
  function salvar(){
    try{
      localStorage.setItem(CHAVE, JSON.stringify({marcas:estado.marcas, tipo:estado.tipo, tema:estado.tema}));
    }catch(e){ /* sem persistência: a sessão continua funcionando */ }
  }

  function embaralhar(a){
    for(var k=a.length-1;k>0;k--){
      var j = Math.floor(Math.random()*(k+1));
      var t = a[k]; a[k] = a[j]; a[j] = t;
    }
    return a;
  }

  function filtrar(){
    return Q.filter(function(q){
      if(estado.tipo === "revisar"){ if(estado.marcas[q.id] !== "revisar") return false; }
      else if(estado.tipo !== "todas" && q.tipo !== estado.tipo) return false;
      if(estado.tema !== "todos" && q.tema !== estado.tema) return false;
      return true;
    });
  }

  function montarOrdem(preservarId){
    var lista = filtrar();
    estado.ordem = embaralhar(lista.map(function(q){ return q.id; }));
    var pos = preservarId ? estado.ordem.indexOf(preservarId) : -1;
    estado.i = pos >= 0 ? pos : 0;
    estado.revelada = false;
  }

  function porId(id){
    for(var k=0;k<Q.length;k++){ if(Q[k].id === id) return Q[k]; }
    return null;
  }

  var palco = document.getElementById("palco");
  var barra = document.getElementById("barra");
  var rodape = document.getElementById("rodape");

  function render(){
    var total = estado.ordem.length;
    document.getElementById("btnPrev").disabled = (estado.i <= 0 || total === 0);
    document.getElementById("btnNext").disabled = (estado.i >= total-1 || total === 0);
    barra.style.width = total ? (((estado.i+1)/total)*100).toFixed(2) + "%" : "0%";

    if(!total){
      palco.innerHTML = '<div class="vazio">Nenhuma questão com estes filtros.<br>Troque o tipo ou o tema na barra acima.</div>';
      rodape.textContent = "";
      return;
    }

    var q = porId(estado.ordem[estado.i]);
    if(!q){ palco.innerHTML = ""; return; }

    var temCenario = q.bullets && q.bullets.length;
    var marca = estado.marcas[q.id] || "";

    var html = '';
    html += '<div class="meta">';
    html += '<span class="tag ' + q.tipo + '">' + (q.tipo === "pratica" ? "Prática" : "Teórica") + '</span>';
    html += '<span class="cont">' + q.id + ' · ' + (estado.i+1) + ' / ' + total + '</span>';
    html += '</div>';

    html += '<article class="card' + (temCenario ? '' : ' semcenario') + '"><div class="card-in">';
    if(temCenario){
      html += '<p class="intro">Considere as afirmações a respeito de um projeto de software:</p><ul class="cenario">';
      for(var k=0;k<q.bullets.length;k++){ html += '<li>' + q.bullets[k] + '</li>'; }
      html += '</ul>';
    }
    var perg = q.pergunta || "Qual o processo mais adequado a este projeto e por quê?";
    html += '<p class="pergunta">' + perg + '</p>';

    html += '<div class="acoes">';
    html += '<button type="button" class="btn-rev" id="btnRevelar">' + (estado.revelada ? "Ocultar resposta" : "Mostrar resposta") + '</button>';
    html += '<div class="marcas">';
    html += '<button type="button" class="mark" data-m="sabe" aria-pressed="' + (marca==="sabe") + '">Sei</button>';
    html += '<button type="button" class="mark" data-m="revisar" aria-pressed="' + (marca==="revisar") + '">Revisar</button>';
    html += '</div></div>';

    if(estado.revelada){
      html += '<div class="resposta"><h4>Resposta esperada</h4>' + q.resposta
           + '<p class="tema-rev">Tema: ' + q.tema + '</p></div>';
    }
    html += '</div></article>';
    palco.innerHTML = html;

    document.getElementById("btnRevelar").addEventListener("click", function(){
      estado.revelada = !estado.revelada; render();
    });
    Array.prototype.forEach.call(palco.querySelectorAll(".mark"), function(b){
      b.addEventListener("click", function(){
        var m = b.getAttribute("data-m");
        estado.marcas[q.id] = (estado.marcas[q.id] === m) ? "" : m;
        salvar(); render(); contar();
      });
    });
    contar();
  }

  function contar(){
    var nP = 0, nT = 0, nR = 0, nS = 0;
    Q.forEach(function(q){
      if(q.tipo === "pratica") nP++; else nT++;
      if(estado.marcas[q.id] === "revisar") nR++;
      if(estado.marcas[q.id] === "sabe") nS++;
    });
    rodape.innerHTML = nP + " práticas · " + nT + " teóricas · " + Q.length + " no total<br>"
      + "marcadas: " + nS + " como sabidas, " + nR + " para revisar<br>"
      + "Base: resumos das aulas de Processos de Desenvolvimento de Software (Wazlawick, Sommerville, Pressman).";
  }

  /* ---------- controles ---------- */
  var segTipo = document.getElementById("segTipo");
  segTipo.addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if(!b) return;
    estado.tipo = b.getAttribute("data-t");
    Array.prototype.forEach.call(segTipo.querySelectorAll("button"), function(x){
      x.setAttribute("aria-pressed", String(x === b));
    });
    salvar(); montarOrdem(); render();
  });

  var selTema = document.getElementById("selTema");
  // Aulas na ordem do curso (window.UNIDADES), só as que já têm questões.
  var temasComQuestoes = [];
  (function(){
    var usados = {};
    Q.forEach(function(q){ usados[q.tema] = true; });
    (window.UNIDADES || []).forEach(function(u){
      u.temas.forEach(function(t){ if(usados[t.nome]) temasComQuestoes.push(t.nome); });
    });
    var opts = '<option value="todos">Todos os temas</option>';
    temasComQuestoes.forEach(function(t){ opts += '<option value="' + t + '">' + t + '</option>'; });
    selTema.innerHTML = opts;
  })();
  selTema.addEventListener("change", function(){
    estado.tema = selTema.value; salvar(); montarOrdem(); render();
  });

  document.getElementById("btnShuffle").addEventListener("click", function(){
    montarOrdem(); render();
  });

  document.getElementById("btnTema").addEventListener("click", function(){
    var atual = document.documentElement.getAttribute("data-theme");
    var escuro = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var proximo;
    if(atual === "dark") proximo = "light";
    else if(atual === "light") proximo = "dark";
    else proximo = escuro ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", proximo);
  });

  function ir(d){
    var novo = estado.i + d;
    if(novo < 0 || novo >= estado.ordem.length) return;
    estado.i = novo; estado.revelada = false; render();
    window.scrollTo({top:0, behavior:"smooth"});
  }
  document.getElementById("btnPrev").addEventListener("click", function(){ ir(-1); });
  document.getElementById("btnNext").addEventListener("click", function(){ ir(1); });

  document.addEventListener("keydown", function(ev){
    var alvo = ev.target;
    if(alvo && (alvo.tagName === "SELECT" || alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA")) return;
    if(ev.key === "ArrowRight"){ ev.preventDefault(); ir(1); }
    else if(ev.key === "ArrowLeft"){ ev.preventDefault(); ir(-1); }
    else if(ev.key === " " || ev.key === "Spacebar"){
      ev.preventDefault();
      estado.revelada = !estado.revelada; render();
    }
  });

  /* ---------- início ---------- */
  ler();
  Array.prototype.forEach.call(segTipo.querySelectorAll("button"), function(x){
    x.setAttribute("aria-pressed", String(x.getAttribute("data-t") === estado.tipo));
  });
  // Um tema salvo que deixou de existir (ex.: os nomes anteriores às aulas) volta a "todos".
  if(estado.tema !== "todos" && temasComQuestoes.indexOf(estado.tema) === -1) estado.tema = "todos";
  selTema.value = estado.tema;
  montarOrdem();
  render();
})();
</script>

</body>
</html>
